<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantabun 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bosco:#123B23;--bosco-2:#0D2A19;--bosco-3:#1B5230;
  --oro:#D6A31A;--oro-2:#F0C64A;--crema:#F3F1E8;--crema-2:#E7E3D4;
  --inch:#15150F;--rosso:#AF3A2C;--blu:#22699F;--verde:#2C9257;--grigio:#6E6B5E;
  --display:"Bodoni Moda",Georgia,serif;--ui:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--crema);color:var(--inch);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.proto{position:sticky;top:0;z-index:60;background:var(--bosco-2);color:var(--crema);display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:9px 18px;border-bottom:1px solid rgba(214,163,26,.3)}
.proto__tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);border:1px solid rgba(214,163,26,.45);padding:3px 8px;border-radius:2px}
.proto__lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,241,232,.45)}
.proto__spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:3px;padding:2px}
.seg button{padding:5px 12px;border-radius:2px;font-size:13px;font-weight:500;color:rgba(243,241,232,.65);transition:.15s}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--bosco-2);font-weight:600}
.proto select{background:rgba(255,255,255,.07);color:var(--crema);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:5px 8px;font-size:13px}
.proto select option{color:#000}

.shell{max-width:1240px;margin:0 auto;padding:26px 20px 90px;display:grid;grid-template-columns:1fr 300px;gap:30px}
.shell--wide{grid-template-columns:1fr}
@media(max-width:960px){.shell{grid-template-columns:1fr;padding:18px 14px 60px}}

.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
h1.title{font-family:var(--display);font-size:clamp(28px,4.2vw,44px);font-weight:700;line-height:1.03;margin:6px 0 0;letter-spacing:-.01em}
h2.sub{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 12px}
.lede{color:var(--grigio);margin:10px 0 0}

.card{background:#fff;border:1px solid var(--crema-2);border-radius:6px;padding:19px}
.card+.card{margin-top:15px}
.card__hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}

.stub{display:grid;grid-template-columns:1fr 14px 1fr;border-radius:5px;overflow:hidden;background:var(--bosco)}
.stub__half{padding:15px 17px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.stub__half--got{background:var(--bosco);color:var(--crema)}
.stub__half--owe{background:repeating-linear-gradient(135deg,rgba(214,163,26,.07) 0 7px,transparent 7px 14px),var(--bosco-2);color:var(--oro-2);border:1px dashed rgba(214,163,26,.55);border-left:0;border-radius:0 5px 5px 0}
.stub__tear{background:var(--bosco);position:relative}
.stub__tear::before{content:"";position:absolute;inset:0;left:6px;width:2px;background-image:linear-gradient(var(--crema) 55%,transparent 0);background-size:2px 8px}
.stub__k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
.stub__v{font-family:var(--display);font-size:25px;font-weight:700;line-height:1}
.stub__n{font-size:13px;opacity:.85}

.fa{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 7px;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;background:var(--bosco);color:var(--oro-2);flex:none}
.fa--b{background:var(--crema-2);color:var(--bosco)}
.fa--free{background:transparent;color:var(--grigio);border:1px dashed var(--crema-2)}
.ru{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;flex:none}
.ru--P{background:var(--oro);color:var(--bosco-2)}.ru--D{background:var(--verde)}.ru--C{background:var(--blu)}.ru--A{background:var(--rosso)}

.turno{border-radius:6px;padding:17px 19px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--bosco);color:var(--crema)}
.turno--tuo{background:var(--oro);color:var(--bosco-2);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(214,163,26,.55)}50%{box-shadow:0 0 0 9px rgba(214,163,26,0)}}
.turno__t{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.05;margin:0}
.turno__s{font-size:13px;opacity:.82;margin:2px 0 0}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:4px;font-weight:600;font-size:14px;background:var(--bosco);color:var(--crema);transition:.15s}
.btn:hover{background:var(--bosco-3)}
.btn--oro{background:var(--oro);color:var(--bosco-2)}.btn--oro:hover{background:var(--oro-2)}
.btn--ghost{background:transparent;color:var(--bosco);border:1px solid var(--crema-2)}.btn--ghost:hover{background:var(--crema)}
.btn--dark{background:transparent;color:var(--crema);border:1px solid rgba(255,255,255,.22)}.btn--dark:hover{background:rgba(255,255,255,.08)}
.btn--sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:not-allowed}

.row{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--crema-2);flex-wrap:wrap;row-gap:2px}
.row:last-child{border-bottom:0}
.row>*{min-width:0}
.row__n,.row__m{overflow-wrap:break-word}
.row__n{font-weight:500}.row__m{font-size:12px;color:var(--grigio)}.row__sp{flex:1}
.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.mut{color:var(--grigio)}
.pick{width:100%;text-align:left;border-radius:4px;padding:8px 10px;transition:.12s;display:flex;align-items:center;gap:11px}
.pick:hover{background:var(--crema)}
.pick[disabled]{opacity:.3}
.scroll{max-height:340px;overflow:auto}
.scroll--tall{max-height:560px}
.search{width:100%;padding:10px 13px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);margin-bottom:6px}
.inp{padding:9px 11px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);width:96px}
.selbox{padding:8px 10px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);color:var(--inch)}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--crema-2);color:var(--grigio);transition:.12s}
.chip[aria-pressed=true]{background:var(--bosco);color:var(--crema);border-color:var(--bosco)}

.rail{position:sticky;top:66px;align-self:start}
@media(max-width:960px){.rail{position:static}}
.crediti{background:var(--bosco);color:var(--crema);border-radius:6px;padding:15px 17px;margin-bottom:13px}
.crediti__n{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--oro-2)}
.crediti__k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
.slots{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 6px 30px}
.slot{width:14px;height:14px;border-radius:2px;background:var(--crema-2)}
.slot--f{background:var(--bosco)}
.slot--cap{background:var(--oro);box-shadow:inset 0 0 0 2px var(--bosco)}
.repline{display:flex;align-items:center;gap:9px;padding:6px 0}
.repline+.repline{border-top:1px solid var(--crema-2)}

.tv{background:var(--bosco-2);color:var(--crema);min-height:calc(100vh - 44px);padding:32px 40px}
.tv__hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid rgba(214,163,26,.28);padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap}
.tv__t{font-family:var(--display);font-size:clamp(30px,4.6vw,54px);font-weight:700;line-height:.98;margin:4px 0 0}
.tv__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.tvc{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:13px 15px}
.tvc--live{background:var(--oro);color:var(--bosco-2);border-color:var(--oro)}
.tvc__n{font-family:var(--display);font-size:21px;font-weight:600;margin:0}
.tvc__v{font-family:var(--mono);font-size:11.5px;opacity:.7}
.tvc__b{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.tvc__grp{display:flex;gap:3px;padding:2px 3px;border-radius:3px;background:rgba(255,255,255,.04)}
.tvc--live .tvc__grp{background:rgba(0,0,0,.06)}
.tvc__b i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.18);font-style:normal;display:block}
.tvc--live .tvc__b i{background:rgba(0,0,0,.14)}
.tvc{width:100%;transition:.12s}
.tvc:hover{border-color:rgba(214,163,26,.5)}
.tvModal{position:fixed;inset:0;background:rgba(13,42,25,.72);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.tvModal__card{background:var(--crema);color:var(--inch);border-radius:8px;padding:22px 24px;max-width:520px;width:100%;max-height:80vh;overflow:auto}

.gonf{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.gonf i{width:13px;height:18px;display:block;clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--grigio);font-style:italic;margin-top:10px}
.tabs{display:flex;gap:2px;margin-bottom:13px;border-bottom:1px solid var(--crema-2);flex-wrap:wrap}
.tabs button{padding:8px 13px;font-size:13px;font-weight:500;color:var(--grigio);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed=true]{color:var(--inch);border-bottom-color:var(--oro);font-weight:600}
.adminbar{background:var(--bosco-2);color:var(--crema);border-radius:6px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.adminbar__k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.warn{border-color:var(--rosso);background:rgba(175,58,44,.06)}
.ok{border-color:var(--verde);background:rgba(44,146,87,.06)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bosco-2);color:var(--crema);padding:11px 20px;border-radius:4px;font-size:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* --- copertina --- */
.cop{min-height:100vh;background:radial-gradient(circle at 50% 44%,var(--bosco-3) 0%,var(--bosco) 46%,var(--bosco-2) 100%);color:var(--crema);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px 20px 54px;text-align:center;position:relative;overflow:hidden}
.cop::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(214,163,26,.045) 0 1px,transparent 1px 13px)}
.cop__in{position:relative;width:100%;max-width:660px}
.cop__t{font-family:var(--display);font-size:clamp(34px,7vw,62px);font-weight:700;line-height:1;margin:9px 0 0;letter-spacing:-.015em}
.cop__s{color:rgba(243,241,232,.62);font-size:14.5px;margin:11px 0 0}
.cop__rule{width:54px;height:1px;background:rgba(214,163,26,.55);margin:20px auto 0}
.cop__ring{position:relative;width:min(80vw,540px);aspect-ratio:1;margin:26px auto 0}
.cop__hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;z-index:2}
.cop__sq{position:absolute;transform:translate(-50%,-50%);width:19.5%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;transition:.16s}
.cop__sq:hover{filter:brightness(1.12)}
.cop__sq:hover .cop__disc{border-color:rgba(214,163,26,.7);box-shadow:0 0 0 4px rgba(214,163,26,.14),0 6px 20px rgba(0,0,0,.34)}
.cop__sq:hover .cop__nm{color:var(--oro-2)}
.cop__disc{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(243,241,232,.055);border:1.5px solid rgba(243,241,232,.16);box-shadow:0 4px 16px rgba(0,0,0,.28);position:relative}
.cop__disc img{width:100%;height:100%;object-fit:cover;display:block}
.cop__disc--hub{border:2px solid rgba(214,163,26,.75);background:radial-gradient(circle at 50% 34%,rgba(214,163,26,.2),rgba(13,42,25,.9));box-shadow:0 0 0 7px rgba(214,163,26,.09),0 10px 34px rgba(0,0,0,.42)}
.cop__disc--img{background:none;border-color:rgba(243,241,232,.28)}
.cop__disc--fit img{object-fit:contain;padding:11%}
.cop__mono{font-family:var(--display);font-weight:700;color:var(--crema);line-height:1;font-size:min(4.2vw,26px)}
.cop__disc--hub .cop__mono{font-size:min(9vw,54px);color:var(--oro-2)}
.cop__flag{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;opacity:.9;mask:radial-gradient(circle at 50% 50%,transparent 0 62%,#000 62%);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 62%,#000 62%)}
.cop__nm{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(243,241,232,.7);line-height:1.3;width:135%;margin:0 -17.5%;transition:.16s}
.cop__cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cop__note{margin-top:18px;font-size:11.5px;color:rgba(243,241,232,.38);font-family:var(--mono);letter-spacing:.05em}
.copModal{position:fixed;inset:0;background:rgba(6,20,12,.82);z-index:140;display:flex;align-items:center;justify-content:center;padding:20px;text-align:left}
.copModal__card{position:relative;width:100%;max-width:440px;max-height:86vh;overflow:auto;background:var(--bosco-2);border:1px solid rgba(214,163,26,.34);border-radius:9px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.copModal__x{position:absolute;right:9px;top:7px;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;color:rgba(243,241,232,.72);background:rgba(0,0,0,.35);z-index:2}
.copModal__x:hover{color:var(--crema);background:rgba(0,0,0,.55)}
.copModal__foto{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:var(--bosco-2);border-bottom:1px solid rgba(214,163,26,.3)}
.copModal__hd{display:flex;gap:14px;align-items:center;padding:16px 18px 0}
.copModal__t{font-family:var(--display);font-size:24px;font-weight:700;margin:3px 0 4px;line-height:1.05;color:var(--crema)}
.copModal__c{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,241,232,.55)}
.copModal__b{padding:12px 18px 20px;margin:0;font-size:14px;line-height:1.6;color:rgba(243,241,232,.78)}
@media(max-width:700px){
  .cop__ring{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:16px 9px;place-items:start center;margin-top:22px}
  .cop__hub{position:static!important;left:auto!important;top:auto!important;transform:none!important;width:min(42vw,150px);grid-column:1/-1;margin-bottom:12px}
  .cop__sq{position:static!important;left:auto!important;top:auto!important;transform:none!important;width:100%}
  .cop__nm{font-size:8px;letter-spacing:.04em;width:118%;margin:0 -9%}
  .cop__mono{font-size:6.4vw}
  .cop__disc--hub .cop__mono{font-size:11vw}
}
</style>

<div class="proto">
  <span class="proto__tag">Fantabun</span>
  <span class="proto__lbl" id="whoLbl">sei</span>
  <select id="who" onchange="setWho(this.value)"></select>
  <span class="proto__lbl" id="viewLbl">vista</span>
  <div class="seg" id="segView"></div>
  <div class="proto__spacer"></div>
  <span class="proto__lbl" id="phaseLbl"></span>
  <button class="btn btn--sm btn--dark" onclick="S.screen='landing';S.landingOpen=null;render()">Regole</button>
  <span class="proto__lbl" id="sbStat">collegamento…</span>
  <span id="adminCtrls" style="display:contents">
  <button class="btn btn--sm btn--dark" onclick="S.settingsPanel=!S.settingsPanel;S.teamPanel=false;S.linkPanel=false;render()">Impostazioni</button>
  <input id="imp" type="file" accept=".json" style="display:none" onchange="importG(this)">
  <input id="impListone" type="file" accept=".csv,.txt" style="display:none" onchange="importListone(this)">
  </span>
</div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let LISTONE = [];
let PL,byId,KITS;

const BND=i=>i<5?'A1':i<10?'A2':i<15?'B1':'B2';
const COMPL={A1:'B2',A2:'B1',B1:'A2',B2:'A1'};
const PBAND={A1:'1',A2:'2',B1:'3',B2:'4'};
const ROLE={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const ROLE1={P:'portiere',D:'difensore',C:'centrocampista',A:'attaccante'};
const TOT={P:2,D:8,C:8,A:6};
const Q={P:[0,0,1,1,0],D:[0,0,2,3,3],C:[0,0,2,3,3],A:[0,0,2,2,2]};
const CONTRADE={Oca:'#0F7B3E',Torre:'#8C3020',Onda:'#1B5FA8',Pantera:'#8E2C6B',Selva:'#2E7D4F',Nicchio:'#1B4C8C',Aquila:'#C9A227',Chiocciola:'#7A5CA8',Drago:'#B03A2C',Istrice:'#3F6E8C'};
let NOMI=[];

/* ---------------- codici di accesso (link personali) ----------------
   I link personali non usano più il nome della squadra in chiaro (chiunque
   avrebbe potuto provare a scrivere il nome di un altro), ma un codice
   opaco per squadra + uno per l'admin, generati una volta e salvati a
   parte da 'fantabun_state' (così sopravvivono ad Azzera/Carica e i link
   già condivisi restano validi). L'admin può rigenerarli da 'Link'. */
function randCode(){const a='abcdefghijkmnpqrstuvwxyz23456789';return Array.from({length:8},()=>a[Math.floor(Math.random()*a.length)]).join('');}
function nuoviCodici(){const teams={};NOMI.forEach((_,i)=>teams[i]=randCode());return{admin:randCode(),teams};}
function salvaCodici(c){try{localStorage.setItem('fantabun_codes',JSON.stringify(c));}catch(e){}}
function caricaCodici(){
  let c=null;
  try{c=JSON.parse(localStorage.getItem('fantabun_codes'));}catch(e){}
  if(!c||!c.admin||!c.teams||Object.keys(c.teams).length!==NOMI.length){c=nuoviCodici();salvaCodici(c);}
  return c;
}
let IDENTITA=null;

let FASCE={},ROLE_RANK={},LISTONE_ALL_KEYS=[];
/* ricostruisce PL/byId/KITS/FASCE/ROLE_RANK/LISTONE_ALL_KEYS a partire da
   LISTONE: si chiama una volta al boot e di nuovo ogni volta che si carica
   un listone aggiornato da Impostazioni → Carica listone. */
function buildDerived(){
  PL=LISTONE.map(r=>({id:r[0],r:r[1],n:r[2],s:r[3],q:r[4],v:r[5]}));
  byId=new Map(PL.map(p=>[p.id,p]));
  KITS=(()=>{const m=new Map();
    PL.filter(p=>p.r==='P').forEach(p=>{const c=m.get(p.s); if(!c||p.q>c.q||(p.q===c.q&&p.v>c.v)) m.set(p.s,{s:p.s,v:p.v,q:p.q,tit:p.n});});
    return [...m.values()].sort((a,b)=>b.q-a.q||b.v-a.v||a.s.localeCompare(b.s));})();
  FASCE={};ROLE_RANK={};
  for(const r of ['D','C','A']){
    const sorted=PL.filter(p=>p.r===r).sort((a,b)=>b.q-a.q||b.v-a.v||a.id-b.id);
    sorted.forEach((p,i)=>ROLE_RANK['c:'+p.id]=i+1);
    sorted.slice(0,20).forEach((p,i)=>FASCE['c:'+p.id]={banda:BND(i),rank:i+1,ruolo:r});
  }
  KITS.forEach((k,i)=>{FASCE['k:'+k.s]={banda:BND(i),rank:i+1,ruolo:'P'};ROLE_RANK['k:'+k.s]=i+1;});
  LISTONE_ALL_KEYS=[...KITS.map(k=>'k:'+k.s),...PL.filter(p=>p.r!=='P').map(p=>'c:'+p.id)]
    .sort((ka,kb)=>{const a=ent(ka),b=ent(kb);return b.q-a.q||b.v-a.v||a.nome.localeCompare(b.nome);});
}
buildDerived();

function ent(key){
  if(key[0]==='c'){const p=byId.get(+key.slice(2));return{key,tipo:'c',nome:p.n,sub:p.s,ruolo:p.r,v:p.v,q:p.q,id:p.id};}
  const k=KITS.find(x=>x.s===key.slice(2));return{key,tipo:'k',nome:k.s,sub:'kit portiere · '+k.tit,ruolo:'P',v:k.v,q:k.q};
}
const bandaOf=k=>FASCE[k]?FASCE[k].banda:null;
const isTop20=k=>!!FASCE[k];

const got=(pid,fase,r)=>ros(pid).filter(a=>a.fase===fase&&a.ruolo===r).length;
const gotTot=(pid,r)=>ros(pid).filter(a=>a.ruolo===r).length;
/* valore di riferimento = Qt.A (quotazione di acquisto) del listone, non il FVM */
const valore=pid=>ros(pid).reduce((s,a)=>s+ent(a.key).q,0);
const completa=pid=>['P','D','C','A'].every(r=>gotTot(pid,r)>=TOT[r]);

function give(pid,key,fase,prezzo,isCap,isLiv){
  const e=ent(key);
  G.own[key]=pid;
  ros(pid).push({key,ruolo:e.ruolo,fase,banda:bandaOf(key),prezzo:prezzo||0,cap:!!isCap,liv:!!isLiv});
  if(prezzo)G.pl[pid].crediti-=prezzo;
}
/* toglie un calciatore dalla rosa di una squadra e lo rimette libero: serve
   alle Fasi 5 e 6, dove per la prima volta un calciatore può cambiare
   squadra o uscire di rosa DOPO essere già stato assegnato. */
function removeRoster(pid,key){
  const arr=ros(pid);
  const i=arr.findIndex(a=>a.key===key);
  if(i<0)return null;
  const rec=arr.splice(i,1)[0];
  delete G.own[key];
  return rec;
}

const capOk=k=>k[0]==='c'&&!isTop20(k)&&free(k)&&byId.get(+k.slice(2)).r!=='P';
function scegliCap(key){
  if(!capOk(key))return toast('Non ammesso come capitano');
  snap();G.f1.sel[me().id]=key;render();
}
function chiudiScelte(){
  const sel=G.f1.sel;
  if(Object.keys(sel).length<10)return toast('Non tutti hanno scelto');
  snap();
  const m={};Object.entries(sel).forEach(([pid,k])=>{(m[k]=m[k]||[]).push(+pid);});
  const duels=Object.entries(m).filter(([k,ps])=>ps.length>1).map(([k,ps])=>({key:k,pids:ps,winner:null,prezzo:0,done:false}));
  Object.entries(m).forEach(([k,ps])=>{if(ps.length===1)give(ps[0],k,1,0,true);});
  G.f1.duels=duels;G.f1.di=0;G.f1.bids={};
  G.f1.stato=duels.length?'duelli':'riscelta';
  if(!duels.length)G.f1.stato=chiRiscegli().length?'riscelta':'rivelato';
  logit('Scelte capitano chiuse'+(duels.length?` · ${duels.length} doppioni`:''));
  render();
}
const duel=()=>G.f1.duels[G.f1.di]||null;
function punta(v){const d=duel();if(!d)return;snap();G.f1.bids[me().id]=Math.max(0,Math.min(v,me().crediti));render();}
function risolviDuel(wid){
  const d=duel();if(!d)return;
  const b=G.f1.bids,prezzo=b[wid]||0;
  if(d.pids.some(p=>b[p]===undefined))return toast('Mancano delle offerte');
  snap();
  give(wid,d.key,1,prezzo,true);
  const persi=d.pids.filter(p=>p!==wid);
  const qta=Math.floor(prezzo/persi.length),resto=prezzo-qta*persi.length;
  persi.forEach((p,i)=>G.pl[p].crediti+=qta+(i<resto?1:0));
  d.winner=wid;d.prezzo=prezzo;d.done=true;
  logit(`${G.pl[wid].nome} vince ${ent(d.key).nome} per ${prezzo} · rimborso a ${persi.map(p=>G.pl[p].nome).join(', ')}`);
  G.f1.bids={};
  if(G.f1.di<G.f1.duels.length-1)G.f1.di++;
  else G.f1.stato=chiRiscegli().length?'riscelta':'rivelato';
  render();
}
const chiRiscegli=()=>P().filter(p=>!cap(p.id)).map(p=>p.id);
function risceglie(key){
  if(!capOk(key))return toast('Non ammesso');
  snap();give(me().id,key,1,0,true);
  logit(`${me().nome} riscegli ${ent(key).nome} come capitano`);
  if(!chiRiscegli().length)G.f1.stato='rivelato';
  render();
}

/* ---------------- fase 2 — asta libera ---------------- */
/* L'ordine di chiamata è CASUALE (una coda mescolata a inizio Fase 2).
   Ogni turno il chiamante sceglie QUALSIASI ruolo (P/D/C/A) ancora dovuto,
   rispettando solo la fascia dovuta per quel ruolo specifico. In più, tutta
   la Fase 2 è divisa in due GIRI GLOBALI: finché anche una sola squadra
   deve ancora prendere una fascia A1/A2 (o 1/2 per i portieri) di un ruolo
   che le manca, si possono chiamare SOLO calciatori di fascia A — le B1/B2
   restano bloccate per tutti, anche per chi le ha già "sbloccate" prendendo
   la propria A. Solo quando tutte le squadre hanno preso, per ogni ruolo
   che serve loro, la propria fascia A, si apre il giro B e si chiamano le
   B1/B2 complementari. Chi vince la propria chiamata richiama subito; a chi
   viene "soffiata" la chiamata il turno torna al giro successivo. Chi ha
   completato tutta la quota di Fase 2 (1P + 2D + 2C + 2A) esce dalla coda
   e non chiama più; chi non ha più nulla di chiamabile nel giro corrente
   (ha già la sua A ma la B è ancora bloccata) viene saltato automaticamente
   finché il giro B non si apre. */
function neededRoles(pid){
  return ['P','D','C','A'].filter(r=>got(pid,2,r)<Q[r][2]);
}
/* fascia dovuta da questa squadra per questo ruolo, SENZA il vincolo del giro globale */
function reqBandsRole(pid,r){
  if(got(pid,2,r)>=Q[r][2])return[];
  const a=ros(pid).find(x=>x.fase===2&&x.ruolo===r&&x.banda&&x.banda[0]==='A');
  if(a)return[COMPL[a.banda]];
  return['A1','A2'];
}
/* true finché il giro A è aperto: almeno una squadra deve ancora prendere
   la fascia A di un ruolo che le serve. */
function stageAOpen(){
  return P().some(p=>['P','D','C','A'].some(r=>{
    if(got(p.id,2,r)>=Q[r][2])return false;
    return !ros(p.id).some(a=>a.fase===2&&a.ruolo===r&&a.banda&&a.banda[0]==='A');
  }));
}
/* fascia dovuta da questa squadra per questo ruolo, filtrata sul giro globale
   corrente: durante il giro A nasconde le B anche a chi le avrebbe già sbloccate. */
function callableBandsRole(pid,r){
  const raw=reqBandsRole(pid,r);
  if(!raw.length)return raw;
  return stageAOpen()?raw.filter(b=>b[0]==='A'):raw;
}
function restaF2(pid){return['P','D','C','A'].reduce((s,r)=>s+Math.max(0,Q[r][2]-got(pid,2,r)),0);}
const maxSpesa=pid=>Math.max(1,G.pl[pid].crediti-Math.max(0,restaF2(pid)-1));
function attivi2(){return P().map(p=>p.id).filter(pid=>neededRoles(pid).length>0);}
/* salta automaticamente chi è ancora in coda ma non ha nulla di chiamabile
   nel giro corrente (ha già la sua A, aspetta che si apra il giro B). */
function caller2(){
  if(!G.f2.q.length)return null;
  let tries=0;
  while(tries<G.f2.q.length){
    const pid=G.f2.q[G.f2.pos%G.f2.q.length];
    if(candidati2(pid).length)return pid;
    G.f2.pos=(G.f2.pos+1)%G.f2.q.length;
    tries++;
  }
  return null;
}
function avviaFase2(){
  snap();
  G.f2={open:null,q:P().map(p=>p.id).sort(()=>Math.random()-.5),pos:0};
  G.phase=2;
  logit('Fase 2 · apre l\'asta libera degli Intoccabili (ordine casuale, si parte dalle fasce A1/A2)');
  render();
}
function chiama2(key){
  const c=caller2();if(c===null)return;
  if(!free(key))return toast('Già preso');
  const e=ent(key);
  const allowed=callableBandsRole(c,e.ruolo);
  if(!allowed.includes(bandaOf(key))){
    const raw=reqBandsRole(c,e.ruolo);
    return toast(raw.includes(bandaOf(key))?'Prima si chiudono tutte le fasce A1/A2, poi si passa alle B':'Fascia non consentita per questo ruolo');
  }
  snap();G.f2.open={key,caller:c};S.q='';render();
}
function eligibili2(){
  const o=G.f2.open;if(!o)return[];
  const e=ent(o.key),b=bandaOf(o.key);
  return P().map(p=>p.id).filter(pid=>reqBandsRole(pid,e.ruolo).includes(b));
}
function aggiudica(wid,prezzo){
  const o=G.f2.open;if(!o)return;
  prezzo=Math.max(1,Math.floor(+prezzo||1));
  if(prezzo>maxSpesa(wid))return toast(`${G.pl[wid].nome} può spendere al massimo ${maxSpesa(wid)}`);
  snap();
  const caller=o.caller;
  give(wid,o.key,2,prezzo);
  logit(`${ent(o.key).nome} → ${G.pl[wid].nome} per ${prezzo} (chiamato da ${G.pl[caller].nome})`);
  if(!neededRoles(wid).length){
    const wi=G.f2.q.indexOf(wid);if(wi>=0)G.f2.q.splice(wi,1);
  }
  if(wid===caller){
    if(G.f2.pos>=G.f2.q.length)G.f2.pos=0;
  } else {
    const ci=G.f2.q.indexOf(caller);
    G.f2.pos=ci>=0?(ci+1)%Math.max(1,G.f2.q.length):(G.f2.q.length?G.f2.pos%G.f2.q.length:0);
  }
  G.f2.open=null;
  if(!G.f2.q.length){logit('Asta libera completata');G.phase=3;G.f3.round=-1;apriGiro3();}
  render();
}
function annullaChiamata(){snap();G.f2.open=null;render();}
function candidati2(pid){
  if(pid===null)return[];
  const roles=neededRoles(pid);
  const out=[];
  roles.forEach(r=>{
    const b=callableBandsRole(pid,r);
    if(!b.length)return;
    const src=r==='P'?KITS.map(k=>'k:'+k.s):PL.filter(p=>p.r===r).map(p=>'c:'+p.id);
    src.forEach(k=>{if(free(k)&&b.includes(bandaOf(k)))out.push(ent(k));});
  });
  return out.sort((a,b)=>b.q-a.q||b.v-a.v||((a.id||0)-(b.id||0)));
}

/* ---------------- fase 3 — draft dei Rockies ---------------- */
function apriGiro3(){
  const ri=G.f3.round+1;
  if(ri>=9){
    const mosse=livellaSquadre();
    const msg=mosse
      ? `Livellamento pre-Fase 4 · ${mosse} calciatori assegnati per pareggiare il numero di giocatori in rosa`
      : `Fase 3 chiusa · tutte le squadre hanno già lo stesso numero di calciatori in rosa`;
    logit(msg);
    G.phase=4;nextF4();
    toast(msg);
    return;
  }
  G.f3.round=ri;G.f3.pos=0;
  G.f3.order=P().map(p=>p.id).sort((a,b)=>valore(a)-valore(b)||G.pl[a].nome.localeCompare(G.pl[b].nome));
  G.phase=3;
  logit(`Fase 3 · apre il giro ${ri+1}`);
  render();
}
/* ---------------- livellamento pre-fase4 ---------------- */
/* Anche la scelta del capitano (Fase 1) è di fatto un draft libero, quindi a
   fine Fase 3 il numero totale di calciatori in rosa deve essere identico
   per tutte le squadre prima di aprire la Fase 4 dell'estrazione casuale.
   Con le quote fisse di Fase 2/3 (uguali per tutti, indipendenti dal ruolo
   scelto per il capitano) questo è già garantito nel gioco normale — questo
   passaggio è la verifica esplicita e la rete di sicurezza che ripristina la
   parità in ogni caso limite (rosa corretta a mano, stato importato da un
   salvataggio precedente...). Le squadre indietro pescano, come nel draft,
   il miglior calciatore libero ancora disponibile per un ruolo che manca
   loro davvero (rispetto alla quota FINALE di rosa, non più a quella della
   sola Fase 3, ormai esaurita per tutti), finché non raggiungono anche loro
   il numero massimo di calciatori delle altre squadre. */
function okLivella(pid,key){
  if(!free(key))return false;
  const e=ent(key);
  if(gotTot(pid,e.ruolo)>=TOT[e.ruolo])return false;
  if(e.tipo==='k'){
    const k2=ros(pid).find(a=>a.fase===2&&a.ruolo==='P');
    return k2?bandaOf(key)===COMPL[k2.banda]:true;
  }
  if(isTop20(key))return false;
  return true;
}
function candidatiLivella(pid){
  const out=[];
  KITS.forEach(k=>{if(okLivella(pid,'k:'+k.s))out.push(ent('k:'+k.s));});
  PL.forEach(p=>{const k='c:'+p.id;if(p.r!=='P'&&okLivella(pid,k))out.push(ent(k));});
  return out.sort((a,b)=>b.q-a.q||b.v-a.v||((a.id||0)-(b.id||0)));
}
function livellaSquadre(){
  const max=Math.max(...P().map(p=>ros(p.id).length));
  let mosse=0,guard=0;
  while(guard++<400){
    const corte=P().filter(p=>ros(p.id).length<max);
    if(!corte.length)break;
    let progress=false;
    corte.forEach(p=>{
      const cand=candidatiLivella(p.id)[0];
      if(cand){give(p.id,cand.key,3,0,false,true);logit(`Livellamento · ${p.nome} prende ${cand.nome}`);mosse++;progress=true;}
    });
    if(!progress)break;
  }
  return mosse;
}
/* il capitano (Fase 1) è di fatto una scelta di draft: alla squadra che lo
   ha preso in un certo ruolo, la Fase 3 chiede un calciatore in meno in
   quello stesso ruolo, cosi che dopo la Fase 3 tutte le squadre abbiano lo
   stesso numero di calciatori per ruolo, qualunque ruolo abbia il capitano. */
function capRuolo(pid){const c=cap(pid);return c?c.ruolo:null;}
function q3(pid,r){const base=Q[r][3];return capRuolo(pid)===r?Math.max(0,base-1):base;}
function caller3(){
  while(G.f3.pos<10&&!candidati3(G.f3.order[G.f3.pos]).length)G.f3.pos++;
  return G.f3.pos<10?G.f3.order[G.f3.pos]:null;
}
/* draft libero: qualsiasi calciatore libero e fuori dai top 20 (riservati
   alla Fase 2) va bene, in qualunque posizione del listone — niente più
   limite ai migliori 10 rimasti per ruolo. */
function ok3(pid,key){
  if(!free(key))return false;
  const e=ent(key);
  if(got(pid,3,e.ruolo)>=q3(pid,e.ruolo))return false;
  if(e.tipo==='k'){
    const k2=ros(pid).find(a=>a.fase===2&&a.ruolo==='P');
    return k2?bandaOf(key)===COMPL[k2.banda]:false;
  }
  if(isTop20(key))return false;
  return true;
}
function pick3(key){
  const c=caller3();if(c===null)return;
  if(!ok3(c,key))return toast('Scelta non valida');
  snap();give(c,key,3,0);
  logit(`Draft · ${G.pl[c].nome} prende ${ent(key).nome}`);
  G.f3.pos++;S.q='';
  if(G.f3.pos>=10)logit(`Giro ${G.f3.round+1} chiuso · valori ricalcolati`);
  render();
}

/* ---------------- fase 4 ---------------- */
/* L'estrazione procede un ruolo alla volta — prima i difensori, poi i
   centrocampisti, poi gli attaccanti — e dentro ogni ruolo a "fasce" da 10
   calciatori (i migliori 10 ancora liberi per quel ruolo). Dentro la fascia
   l'ordine dei calciatori NON è casuale: si segue il listone, quindi si
   mette in palio sempre il calciatore di valore più alto rimasto nella
   fascia. L'unica cosa che resta a sorte è QUALE squadra lo riceve (il tiro
   di dado sulla contrada, in estrai()). Il capitano di ciascuna squadra ha
   già "consumato" un posto del suo ruolo in Fase 3 (vedi q3()), quindi qui
   ogni fascia vale sempre 10 e ogni squadra pesca sempre 3 D, 3 C, 2 A. */
const RUOLI_F4=['D','C','A'];
function restanti4(){
  const need={};RUOLI_F4.forEach(r=>need[r]=P().some(p=>gotTot(p.id,r)<TOT[r]));
  const esclusi=G.f4.esclusi||[];
  return PL.filter(p=>need[p.r]&&free('c:'+p.id)&&!esclusi.includes('c:'+p.id)).sort((a,b)=>b.q-a.q||b.v-a.v||a.id-b.id);
}
/* riempie G.f4.band con la prossima fascia del ruolo corrente, avanzando
   di ruolo (D→C→A→fine) quando un ruolo è completo per tutte le squadre. */
/* quanti D/C/A servono ANCORA in totale a tutte le squadre insieme, per il
   ruolo r (somma dei "posti mancanti" squadra per squadra). */
function domandaRuolo(r){return P().reduce((s,p)=>s+Math.max(0,TOT[r]-gotTot(p.id,r)),0);}
function fillBand(){
  let guard=0;
  while(G.f4.role&&guard++<200){
    const r=G.f4.role;
    const domanda=domandaRuolo(r);
    if(!domanda){
      const i=RUOLI_F4.indexOf(r);
      G.f4.role=i<RUOLI_F4.length-1?RUOLI_F4[i+1]:null;
      G.f4.bandIdx=0;
      continue;
    }
    const grezza=10;
    /* mai più grande della domanda residua vera: evita candidati "orfani"
       che nessuna squadra può più ricevere (es. dopo un ripristino di uno
       stato salvato a metà fascia, quando la posizione esatta nella
       sequenza non è più nota con certezza). */
    const size=Math.min(grezza,domanda);
    G.f4.bandIdx++;
    if(!size)continue;
    const esclusi=G.f4.esclusi||[];
    const pool=PL.filter(p=>p.r===r&&free('c:'+p.id)&&!esclusi.includes('c:'+p.id))
      .sort((a,b)=>b.q-a.q||b.v-a.v||a.id-b.id)
      .slice(0,size).map(p=>'c:'+p.id);
    if(!pool.length)continue;
    /* niente rimescolamento: il pool è già ordinato per valore (Qt.A poi FVM)
       discendente, quindi si segue il listone e si mette in palio sempre il
       primo/migliore rimasto nella fascia. */
    G.f4.band=pool;
    G.f4.bandDrawn=[];
    return;
  }
  G.f4.band=[];
  G.f4.bandDrawn=[];
}
function nextF4(){
  if(!G.f4.band||!G.f4.band.length)fillBand();
  G.phase=4;G.f4.cur=(G.f4.band&&G.f4.band.length)?G.f4.band[0]:null;G.f4.skip=null;
  render();
}
/* l'urna si restringe al reparto del calciatore in palio: una squadra che ha
   già completato QUEL ruolo (anche se la rosa nel complesso non è ancora
   finita) non entra proprio nel tiro a sorte, così ci si concentra solo su
   chi ha davvero un buco lì. In più, dentro la STESSA fascia da 10 una
   squadra che ha già ricevuto un calciatore non può essere ripescata: così
   ogni fascia si distribuisce equamente, una a testa, invece di lasciare
   che la sorte dia due calciatori alla stessa squadra e zero a un'altra.
   L'esclusione si azzera a ogni nuova fascia (fillBand). Se per uno stato
   anomalo (es. un ripristino a metà fascia) l'esclusione lascerebbe l'urna
   vuota pur essendoci squadre col ruolo scoperto, si ignora come rete di
   sicurezza — meglio un'estrazione ripetuta che un blocco totale. Senza un
   calciatore in palio (fra un'estrazione e l'altra) torna al criterio
   generale di rosa completa. */
const urna=()=>{
  const k=G.f4.cur;
  if(!k)return P().filter(p=>!completa(p.id));
  const r=ent(k).ruolo;
  const base=P().filter(p=>gotTot(p.id,r)<TOT[r]);
  const drawn=G.f4.bandDrawn||[];
  const fresh=base.filter(p=>!drawn.includes(p.id));
  return fresh.length?fresh:base;
};
function estrai(pid){
  const k=G.f4.cur;if(!k)return;
  const e=ent(k);snap();
  if(completa(pid)){G.f4.skip=`${G.pl[pid].nome} ha la rosa completa: fuori dall'urna.`;return render();}
  if(gotTot(pid,e.ruolo)>=TOT[e.ruolo]){
    G.f4.skip=`${G.pl[pid].nome} ha già ${TOT[e.ruolo]} ${ROLE[e.ruolo].toLowerCase()}. Si riestrae.`;
    G.f4.last={esito:'scartata',nome:e.nome,sub:e.sub,ruolo:e.ruolo,contrada:G.pl[pid].contrada,squadra:G.pl[pid].nome};
    logit(`${e.nome} · ${G.pl[pid].contrada} scartata (ruolo pieno)`);
    return render();
  }
  G.f4.last={esito:'assegnato',nome:e.nome,sub:e.sub,ruolo:e.ruolo,contrada:G.pl[pid].contrada,squadra:G.pl[pid].nome};
  give(pid,k,4,0);
  G.f4.bandDrawn=G.f4.bandDrawn||[];
  if(!G.f4.bandDrawn.includes(pid))G.f4.bandDrawn.push(pid);
  logit(`${e.nome} → ${G.pl[pid].nome} (${G.pl[pid].contrada})`);
  if(G.f4.band&&G.f4.band[0]===k)G.f4.band.shift();
  nextF4();
}
/* l'admin può escludere il calciatore in palio (es. infortunio grave) prima
   di estrarre: non va a nessuna squadra ed esce definitivamente dall'urna. */
function escludiCorrente(){
  const k=G.f4.cur;if(!k)return;
  const e=ent(k);
  snap();
  G.f4.esclusi=G.f4.esclusi||[];
  G.f4.esclusi.push(k);
  G.f4.skip=null;
  G.f4.last={esito:'escluso',nome:e.nome,sub:e.sub,ruolo:e.ruolo};
  logit(`${e.nome} escluso dall'estrazione dall'admin (non assegnato a nessuna squadra)`);
  if(G.f4.band&&G.f4.band[0]===k)G.f4.band.shift();
  nextF4();
}

/* ---------------- fase 5 — le carte ----------------
   Le carte si giocano OFFLINE, fuori dall'app: qui c'è solo la "regia" che
   registra l'esito. Una squadra (la "ladra") ne usa una per rubare un
   calciatore a un'altra (la "derubata"); in cambio, la derubata riceve
   sempre indietro un calciatore dello STESSO ruolo dalla squadra ladra —
   uno scambio 1 a 1 che non altera mai la composizione per ruolo delle
   rose (restano sempre 2 P, 8 D, 8 C, 6 A a testa). */
function apriFase5(){
  snap();G.phase=5;
  logit('Fase 5 · si aprono le carte');
  render();
}
function f5SetLadro(v){S.f5Ladro=v?+v:null;if(S.f5Ladro===S.f5Vittima)S.f5Vittima=null;S.f5KeyRubato=null;S.f5KeyRestituito=null;render();}
function f5SetVittima(v){S.f5Vittima=v?+v:null;if(S.f5Vittima===S.f5Ladro)S.f5Ladro=null;S.f5KeyRubato=null;S.f5KeyRestituito=null;render();}
function f5PickRubato(key){S.f5KeyRubato=key;S.f5KeyRestituito=null;render();}
function f5PickRestituito(key){S.f5KeyRestituito=key;render();}
function f5Reset(){S.f5Ladro=null;S.f5Vittima=null;S.f5KeyRubato=null;S.f5KeyRestituito=null;render();}
function scambiaCarte(ladroId,vittimaId,keyRubato,keyRestituito){
  if(ladroId==null||vittimaId==null||ladroId===vittimaId)return toast('Scegli due squadre diverse');
  if(owner(keyRubato)!==vittimaId)return toast('Il calciatore rubato non è (più) di quella squadra');
  if(owner(keyRestituito)!==ladroId)return toast('Il calciatore restituito non è (più) di quella squadra');
  const eR=ent(keyRubato),eD=ent(keyRestituito);
  if(eR.ruolo!==eD.ruolo)return toast('Lo scambio deve avvenire tra calciatori dello stesso ruolo');
  snap();
  removeRoster(vittimaId,keyRubato);
  removeRoster(ladroId,keyRestituito);
  give(ladroId,keyRubato,5,0);
  give(vittimaId,keyRestituito,5,0);
  logit(`Carte · ${G.pl[ladroId].nome} ruba ${eR.nome} a ${G.pl[vittimaId].nome}, in cambio ${eD.nome}`);
  f5Reset();
  toast('Scambio registrato');
}

/* ---------------- fase 6 — ultime modifiche ----------------
   Per infortuni gravi tra i calciatori già assegnati: si sostituisce un
   calciatore in rosa con uno libero dello STESSO ruolo, scelto da tutto il
   listone senza i vincoli di fascia delle fasi di assegnazione — qui conta
   solo tappare il buco prima dell'inizio del campionato. */
function apriFase6(){
  snap();G.phase=6;
  logit('Fase 6 · si aprono le ultime modifiche');
  render();
}
function f6SetTeam(v){S.f6Team=v?+v:null;S.f6KeyOut=null;S.q='';render();}
function f6PickOut(key){S.f6KeyOut=key;S.q='';render();}

function sostituisci(pid,keyVecchio,keyNuovo){
  if(pid==null||!keyVecchio||!keyNuovo)return;
  if(owner(keyVecchio)!==pid)return toast('Calciatore non (più) in quella rosa');
  if(!free(keyNuovo))return toast('Quel calciatore non è libero');
  const eV=ent(keyVecchio),eN=ent(keyNuovo);
  if(eV.ruolo!==eN.ruolo)return toast('La sostituzione deve avvenire tra calciatori dello stesso ruolo');
  snap();
  removeRoster(pid,keyVecchio);
  give(pid,keyNuovo,6,0);
  logit(`Modifica finale · ${G.pl[pid].nome} sostituisce ${eV.nome} con ${eN.nome} (infortunio)`);
  f6Reset();
  toast('Sostituzione registrata');
}

/* ---------------- auto ---------------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function auto(n){
  for(let i=0;i<n;i++){
    if(G.phase===0){G.phase=1;continue;}
    if(G.phase===1){
      if(G.f1.stato==='scelta'){
        const chi=P().find(p=>!G.f1.sel[p.id]);
        if(chi){const c=PL.filter(p=>capOk('c:'+p.id));G.f1.sel[chi.id]='c:'+rnd(c).id;continue;}
        chiudiScelte();continue;
      }
      if(G.f1.stato==='duelli'){const d=duel();d.pids.forEach(p=>{if(G.f1.bids[p]===undefined)G.f1.bids[p]=1+Math.floor(Math.random()*18);});
        let w=d.pids[0];d.pids.forEach(p=>{if(G.f1.bids[p]>G.f1.bids[w])w=p;});risolviDuel(w);continue;}
      if(G.f1.stato==='riscelta'){const chi=chiRiscegli()[0];if(chi!==undefined){const c=PL.filter(p=>capOk('c:'+p.id));
        give(chi,'c:'+rnd(c).id,1,0,true);if(!chiRiscegli().length)G.f1.stato='rivelato';continue;}}
      if(G.f1.stato==='rivelato'){avviaFase2();continue;}
    }
    if(G.phase===2){
      if(!G.f2.q.length){G.phase=3;G.f3.round=-1;apriGiro3();continue;}
      if(!G.f2.open){const c=caller2();const cand=candidati2(c);if(!cand.length){continue;}
        G.f2.open={key:rnd(cand.slice(0,8)).key,caller:c};continue;}
      const el=eligibili2();const w=rnd(el.length?el:[G.f2.open.caller]);
      aggiudica(w,1+Math.floor(Math.random()*Math.min(9,maxSpesa(w))));continue;
    }
    if(G.phase===3){
      if(G.f3.pos>=10){apriGiro3();continue;}
      const c=caller3();const cand=candidati3(c);
      if(!cand.length){G.f3.pos++;continue;}
      pick3(rnd(cand.slice(0,25)).key);continue;
    }
    if(G.phase===4){
      if(!G.f4.cur){nextF4();if(!G.f4.cur)break;}
      const u=urna();if(!u.length)break;estrai(rnd(u).id);continue;
    }
  }
  render();
}
function autoCapitani(){
  let guard=0;
  while(G.phase===1&&G.f1.stato!=='rivelato'&&guard<500){
    guard++;
    if(G.f1.stato==='scelta'){
      const chi=P().find(p=>!G.f1.sel[p.id]);
      if(chi){const c=PL.filter(p=>capOk('c:'+p.id));G.f1.sel[chi.id]='c:'+rnd(c).id;continue;}
      chiudiScelte();continue;
    }
    if(G.f1.stato==='duelli'){
      const d=duel();if(!d)break;
      d.pids.forEach(p=>{if(G.f1.bids[p]===undefined)G.f1.bids[p]=1+Math.floor(Math.random()*18);});
      let w=d.pids[0];d.pids.forEach(p=>{if(G.f1.bids[p]>G.f1.bids[w])w=p;});
      risolviDuel(w);continue;
    }
    if(G.f1.stato==='riscelta'){
      const chi=chiRiscegli()[0];
      if(chi===undefined)break;
      const c=PL.filter(p=>capOk('c:'+p.id));
      give(chi,'c:'+rnd(c).id,1,0,true);
      if(!chiRiscegli().length)G.f1.stato='rivelato';
      continue;
    }
    break;
  }
  render();
}
function candidati3(pid){
  if(pid===null)return[];
  const out=[];
  KITS.forEach(k=>{if(ok3(pid,'k:'+k.s))out.push(ent('k:'+k.s));});
  PL.forEach(p=>{const k='c:'+p.id;if(p.r!=='P'&&ok3(pid,k))out.push(ent(k));});
  return out.sort((a,b)=>b.q-a.q||b.v-a.v||((a.id||0)-(b.id||0)));
}

  const q=S.q.toLowerCase();

function rail(){
  const p=me(),c=cap(p.id);
  let out='';
  for(const r of ['P','D','C','A']){
    const arr=ros(p.id).filter(a=>a.ruolo===r);
    let s='';
    for(let i=0;i<TOT[r];i++){
      const a=arr[i];
      s+=`<span class="slot ${a?(a.cap?'slot--cap':'slot--f'):''}"></span>`;
    }
    out+=`<div class="repline">${ru(r)}<span class="row__n" style="font-size:13px">${ROLE[r]}</span><span class="row__sp"></span><span class="num mut">${arr.length}/${TOT[r]}</span></div><div class="slots">${s}</div>`;
  }
  const det=ros(p.id).slice().sort((a,b)=>'PDCA'.indexOf(a.ruolo)-'PDCA'.indexOf(b.ruolo)||b.prezzo-a.prezzo)
    .map(a=>`<div class="row">${ru(a.ruolo)}${fab(a.banda,a.ruolo==='P')}<span class="row__n">${esc(ent(a.key).nome)}${a.cap?' <span style="color:var(--oro)">♛</span>':''}</span><span class="row__sp"></span><span class="num mut">${a.prezzo||'—'}</span></div>`).join('');
  return `<aside class="rail">
    <div class="crediti">
      <div class="crediti__k">crediti residui</div><div class="crediti__n">${p.crediti}</div>
      <div class="crediti__k" style="margin-top:9px">capitano</div>
      <div style="font-family:var(--display);font-size:18px;font-weight:600">${c?esc(ent(c.key).nome)+' <span style="color:var(--oro-2)">♛</span>':'<span style="opacity:.5">non ancora</span>'}</div>
      <div class="crediti__k" style="margin-top:9px">contrada · valore squadra (acquisto)</div>
      <div style="font-size:13px">${gonf(p.contrada)} <span class="num" style="opacity:.8">${valore(p.id)}</span></div>
    </div>
    <div class="card"><div class="card__hd"><h2 class="sub" style="margin:0">La mia rosa</h2><span class="num mut">${ros(p.id).length}/24</span></div>
      ${out}${det?`<div style="margin-top:12px;border-top:1px solid var(--crema-2);padding-top:6px">${det}</div>`:''}</div></aside>`;
}

  const r=S.tab;
  const full=r==='P'?KITS.map(k=>'k:'+k.s):PL.filter(p=>p.r===r).sort((a,b)=>b.q-a.q||b.v-a.v||a.id-b.id).slice(0,20).map(p=>'c:'+p.id);
  const teams=[...new Set(full.map(k=>teamOf(ent(k))))].sort((a,b)=>a.localeCompare(b));

  return `${admin}<span class="eyebrow">Fase 0 — preparazione</span><h1 class="title">Le fasce</h1>

    <div class="card" style="margin-top:20px"><div class="tabs">${['P','D','C','A'].map(x=>`<button aria-pressed="${x===r}" onclick="S.tab='${x}';S.v0team='Tutte';render()">${ROLE[x]}</button>`).join('')}</div>

function f2Riepilogo(){
  const rows=P().map(p=>{
    const cells=['P','D','C','A'].map(r=>{
      const need=Q[r][2];
      const picks=ros(p.id).filter(a=>a.fase===2&&a.ruolo===r);
      const badges=picks.map(a=>fab(a.banda,r==='P')).join('');
      const empty=Array(Math.max(0,need-picks.length)).fill(fab(null,r==='P')).join('');

    for(let i=0;i<TOT[r];i++){
      const a=roleArr[i];
      const fillStyle=a?`background:var(--${RCOL[r]})${a.cap?';box-shadow:inset 0 0 0 2px var(--bosco-2)':''}`:'';
      inner+=`<i style="${fillStyle}"></i>`;
    }
    return `<span class="tvc__grp">${inner}</span>`;

function tvManca(pid){

/* --- copertina --- */
function iniziali(s){
  const w=String(s||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length)return '?';
  return (w.length===1?w[0].slice(0,2):w[0][0]+w[1][0]).toUpperCase();
}
function discoLogo(src,alt,extra,fallback,fit){
  const cl=(extra||'')+(src?' cop__disc--img':'')+(src&&fit==='contain'?' cop__disc--fit':'');
  return `<div class="cop__disc ${cl}">${
    src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:fallback
  }</div>`;
}
/* scheda squadra: accetta sia la forma estesa {club,logo,foto,bio} sia una semplice stringa-URL */
function schedaSq(p){
  const v=(LOGHI.squadre||{})[p.nome];
  const o=(typeof v==='string')?{logo:v}:(v||{});
  return {club:o.club||null,logo:o.logo||null,foto:o.foto||null,bio:o.bio||null,fit:o.fit||'cover'};
}
/* ritratto segnaposto del fanta allenatore, generato al volo nei colori della contrada */
function ritrattoSegnaposto(col,ini){
  return `<svg class="copModal__foto" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ritratto in arrivo">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0D2A19"/></linearGradient></defs>
    <rect width="400" height="300" fill="#0D2A19"/>
    <rect width="400" height="300" fill="url(#rg)"/>
    <g opacity=".16" stroke="#F3F1E8" stroke-width="1">
      <circle cx="200" cy="196" r="96" fill="none"/><circle cx="200" cy="196" r="118" fill="none" opacity=".5"/></g>
    <g fill="#F3F1E8" opacity=".9">
      <circle cx="200" cy="150" r="33"/>
      <path d="M141 300c0-33 26-59 59-59s59 26 59 59z"/></g>
    <path d="M170 244l30 16 30-16 8 6-38 20-38-20z" fill="${col}" opacity=".95"/>
    <text x="20" y="30" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.7" fill="#F3F1E8" opacity=".42">RITRATTO IN ARRIVO</text>
    <text x="20" y="286" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#F3F1E8" opacity=".45">${esc(ini)}</text>
  </svg>`;
}
function copOpen(id){S.copSel=id;render();}
function copClose(){S.copSel=null;render();}
function copModal(){
  if(S.copSel===null||S.copSel===undefined)return'';
  const p=G.pl[S.copSel];if(!p)return'';
  const s=schedaSq(p),col=CONTRADE[p.contrada]||'#6E6B5E',ini=iniziali(p.nome);
  const fb=`<span class="cop__flag" style="background:conic-gradient(from 180deg,${col},rgba(255,255,255,.22),${col})"></span><span class="cop__mono">${esc(ini)}</span>`;
  return `<div class="copModal" onclick="if(event.target===this)copClose()">
    <div class="copModal__card">
      <button class="copModal__x" onclick="copClose()" aria-label="Chiudi">×</button>
      ${s.foto?`<img class="copModal__foto" src="${esc(s.foto)}" alt="Fanta allenatore ${esc(p.nome)}">`:ritrattoSegnaposto(col,ini)}
      <div class="copModal__hd">
        <div style="width:64px;flex:none">${discoLogo(s.logo,p.nome,'',fb,s.fit)}</div>
        <div style="min-width:0">
          <span class="eyebrow">Fanta allenatore · ${esc(p.nome)}</span>
          <h2 class="copModal__t">${esc(s.club||p.nome)}</h2>
          <span class="copModal__c">contrada ${esc(p.contrada)}</span>
        </div>
      </div>
      <p class="copModal__b">${esc(s.bio||'Scheda in arrivo: foto e presentazione del fanta allenatore verranno aggiunte a breve.')}</p>
    </div></div>`;
}
function copertina(){
  const teams=P();
  const R=39;                              /* raggio del cerchio, in % del contenitore */
  const dischi=teams.map((p,i)=>{
    const a=(-90+i*(360/teams.length))*Math.PI/180;
    const x=50+R*Math.cos(a),y=50+R*Math.sin(a);
    const col=CONTRADE[p.contrada]||'#6E6B5E';
    const s=schedaSq(p);
    const fb=`<span class="cop__flag" style="background:conic-gradient(from 180deg,${col},rgba(255,255,255,.22),${col})"></span><span class="cop__mono">${esc(iniziali(p.nome))}</span>`;
    return `<button class="cop__sq" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%" onclick="copOpen(${p.id})" title="${esc(s.club||p.nome)} — apri la scheda">
      ${discoLogo(s.logo,p.nome,'',fb,s.fit)}
      <span class="cop__nm">${esc(s.club||p.nome)}</span></button>`;
  }).join('');
  const hubFb=`<span class="cop__mono">FB</span>`;
  const mancano=teams.some(p=>!schedaSq(p).logo);
  return `<div class="cop"><div class="cop__in">
    <span class="eyebrow">Stagione 26/27</span>
    <h1 class="cop__t">Fantabun</h1>
    <p class="cop__s">Dieci squadre, una contrada a testa, sette fasi per costruire la rosa.</p>
    <div class="cop__rule"></div>
    <div class="cop__ring">
      <div class="cop__hub">${discoLogo(LOGHI.lega,'Fantabun','cop__disc--hub',hubFb,LOGHI.fitLega)}</div>
      ${dischi}
    </div>
    <div class="cop__cta">
      <button class="btn btn--oro" onclick="S.screen='landing';S.landingOpen=null;render()">Entra · come funziona la lega</button>
    </div>
    <p class="cop__note">Clicca uno stemma per la scheda del fanta allenatore${mancano?' · loghi mancanti a segnaposto':''}</p>
  </div>${copModal()}</div>`;
}

const FASI=[

  {n:1,t:'Scelta del capitano',d:"Ogni squadra sceglie in segreto un capitano: un calciatore fuori dai primi 20 del proprio ruolo, portieri esclusi. Il capitano resta per sempre in rosa, nessuno può rubarlo. Se due o più squadre scelgono lo stesso nome, si va a un'asta a buste chiuse fra loro: chi vince paga in crediti, gli altri sono rimborsati e riscelgono un altro nome."},
  {n:2,t:'Asta libera degli Intoccabili',d:"Si assegnano gli Intoccabili — 1 portiere (kit), 2 difensori, 2 centrocampisti, 2 attaccanti a testa — tutti dalle fasce A1/A2/B1/B2 (1-4 per i portieri). L'ordine di chiamata è casuale: ogni turno il chiamante propone un ruolo che gli manca, partendo dalla fascia A/1-2, e passa alla fascia B/3-4 complementare solo dopo aver preso quella A. Si punta a voce, base 1 credito; chi vince richiama subito, a chi viene soffiata la chiamata tocca al giro dopo. Si esce dalla coda a quota completata."},
  {n:3,t:'Draft dei Rockies',d:"Un draft a giri: l'ordine di ogni giro va dal valore squadra più basso al più alto (somma dei Qt.A in rosa), ricalcolato solo a fine giro. Il draft è libero: si può scegliere qualsiasi calciatore ancora disponibile, di qualsiasi ruolo mancante, in qualunque posizione del listone — fuori solo dai primi 20 di ruolo (già assegnati in Fase 2). La quota per ruolo è 1 P, 3 D, 3 C, 2 A a testa, tranne per il ruolo del proprio capitano: la scelta del capitano, in Fase 1, vale come una scelta di draft, quindi in quel ruolo la squadra ne pesca uno in meno in Fase 3. Cosi, qualunque ruolo abbia il capitano, tutte le squadre chiudono la Fase 3 con lo stesso numero di calciatori per ruolo. Il draft dura 9 giri da 10 chiamate ciascuno (una squadra può chiudere prima se ha già completato tutte le sue quote). Prima di aprire la Fase 4, un livellamento di sicurezza pareggia eventuali squadre rimaste indietro."},
  {n:4,t:'I Figli dei Berberi',d:"I calciatori rimasti vengono assegnati per estrazione, un ruolo alla volta — prima i difensori, poi i centrocampisti, poi gli attaccanti — a fasce da 10 (i migliori 10 ancora liberi per quel ruolo). Dentro la fascia si segue il listone: è sempre in palio il calciatore di valore più alto rimasto, non uno a caso. Per ogni calciatore in palio si tira a sorte quale squadra (contrada) lo riceve, tra quelle che hanno ancora un posto libero in quel ruolo E non hanno già ricevuto un calciatore in quella stessa fascia: dentro una fascia da 10 ogni squadra ne prende al massimo uno, cosi la sorte distribuisce equamente invece di dare due calciatori alla stessa squadra e zero a un'altra. Poiché il capitano ha già consumato un posto del suo ruolo in Fase 3, ogni squadra arriva in Fase 4 con lo stesso identico fabbisogno — 3 D, 3 C, 2 A — e finisce con 2 kit portiere, 8 difensori, 8 centrocampisti, 6 attaccanti."},
  {n:5,t:'Le carte',d:"Si gioca offline, fuori dall'app: una squadra può usare una carta per rubare un calciatore a un'altra. L'app serve solo a registrare l'esito — l'admin indica chi ruba, a chi, e quale calciatore; in cambio, la squadra derubata riceve sempre un calciatore dello stesso ruolo dalla squadra ladra, cosi lo scambio è sempre alla pari e le rose restano da 2 P, 8 D, 8 C, 6 A a testa."},
  {n:6,t:'Ultime modifiche',d:"Con le rose ormai definite, uno spazio per gli imprevisti: se tra i calciatori assegnati c'è un infortunio grave prima dell'inizio del campionato, l'admin può sostituirlo con un calciatore libero dello stesso ruolo, scelto da tutto il listone senza i vincoli di fascia delle fasi precedenti."}

/* --- listone completo --- */
function listoneRow(key){
  const e=ent(key);
  const o=owner(key);
  let right;
  if(o===undefined){
    right=`<span class="row__m mut">libero</span>`;
  } else {
    const pl=G.pl[o];
    const a=ros(o).find(x=>x.key===key);
    const prov=a?(a.cap?'Capitano':(a.liv?'Livellamento':(FASE_LBL[a.fase]||''))):'';
    right=`${gonf(pl.contrada)}<span class="row__n">${esc(pl.nome)}</span><span class="row__m">${esc(prov)}${a&&a.prezzo?' · '+a.prezzo+' cr':''}</span>`;
  }
  const pos=ROLE_RANK[key]?`<span class="num mut" style="width:34px">${ROLE_RANK[key]}°</span>`:'';
  return `<div class="row">${pos}${e.ruolo?ru(e.ruolo):''}<span class="row__n">${esc(e.nome)}</span><span class="row__m">${esc(e.sub)}</span><span class="row__sp"></span><span class="num mut" style="width:30px">${e.q}</span>${right}</div>`;
}
function listone(){
  const rf=S.lsRole||'Tutti',teamF=S.lsTeam||'Tutte',statF=S.lsStatus||'Tutti',q=(S.q||'').toLowerCase();
  const base=rf==='Tutti'?LISTONE_ALL_KEYS:LISTONE_ALL_KEYS.filter(k=>ent(k).ruolo===rf);
  const teams=[...new Set(base.map(k=>teamOf(ent(k))))].sort((a,b)=>a.localeCompare(b));
  const rows=base.filter(k=>{
    const e=ent(k);
    if(teamF!=='Tutte'&&teamOf(e)!==teamF)return false;
    if(q&&!(e.nome.toLowerCase().includes(q)||e.sub.toLowerCase().includes(q)))return false;
    const assigned=owner(k)!==undefined;
    if(statF==='Liberi'&&assigned)return false;
    if(statF==='Assegnati'&&!assigned)return false;
    return true;
  });
  const nAss=base.filter(k=>owner(k)!==undefined).length;
  return `<div class="shell shell--wide">
    <span class="eyebrow">Listone completo</span><h1 class="title">Chi ha preso chi</h1>
    <p class="lede">Tutti i calciatori del listone, in ordine di valore d'acquisto (Qt.A): chi è ancora libero e chi è già stato assegnato, a chi e come.</p>
    <div class="card" style="margin-top:20px">
    ${searchBox('Cerca un calciatore…')}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 12px">
      ${teamSelect(teamF,"S.lsTeam=this.value;render()",teams)}
      ${roleTabs(rf,'setLsRole',['P','D','C','A'])}
      <div style="display:flex;gap:5px;flex-wrap:wrap">${['Tutti','Liberi','Assegnati'].map(s=>`<button class="chip" aria-pressed="${s===statF}" onclick="S.lsStatus='${s}';render()">${s}</button>`).join('')}</div>
    </div>
    <div class="scroll scroll--tall">${rows.map(listoneRow).join('')||'<div class="note">Nessun risultato con questi filtri.</div>'}</div>
    <div class="note">${rows.length} di ${base.length} calciatori mostrati · ${nAss} già assegnati, ${base.length-nAss} liberi in totale su questo filtro ruolo.</div></div>
  </div>`;
}

/* "Salva" scarica DUE file: il .json di sessione (serve per "Carica" e riprendere
   la partita) e un .csv con la lista delle rose in quel momento, apribile
   direttamente in Excel — una rete di sicurezza leggibile da chiunque anche
   se il .json dovesse risultare corrotto o inutilizzabile per un qualsiasi
   malfunzionamento. */
function csvCell(v){v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportRoseCSV(){
  const rows=[['Squadra','Contrada','Ruolo','Calciatore','Squadra Serie A','Fase','Capitano','Prezzo']];
  P().forEach(p=>{
    const arr=ros(p.id).slice().sort((a,b)=>'PDCA'.indexOf(a.ruolo)-'PDCA'.indexOf(b.ruolo)||b.prezzo-a.prezzo);
    if(!arr.length)rows.push([p.nome,p.contrada,'','(rosa vuota)','','','','']);
    arr.forEach(a=>{const e=ent(a.key);
      rows.push([p.nome,p.contrada,a.ruolo,e.nome,e.sub||'',a.liv?'Livellamento':(FASE_LBL[a.fase]||a.fase),a.cap?'sì':'no',a.prezzo||0]);});
  });
  const csv='﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='fantabun-rose.csv';a.click();
}
function exportG(){const b=new Blob([JSON.stringify(G)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='fantabun-sessione.json';a.click();
  setTimeout(exportRoseCSV,150);}
/* ripara uno stato (caricato da file o da localStorage) salvato da una
   versione dell'app precedente al meccanismo a fasce/ruolo di Fase 4:
   non basta riempire i campi mancanti con dei default, perché altrimenti
   il calciatore "in palio" (cur) resta quello di un ruolo magari già
   completo, e l'estrazione si blocca per sempre senza mai avanzare.
   Va chiamata SOLO dopo aver assegnato lo stato a G (P()/gotTot()/
   fillBand() leggono tutte la G globale), e ricostruisce da zero ruolo,
   fascia e candidato corrente in base a cosa manca davvero alle squadre. */
function normalizzaF4(g){
  if(!g.f4)g.f4={cur:null,skip:null,last:null,esclusi:[]};
  if(!g.f4.esclusi)g.f4.esclusi=[];
  if(g.f4.band===undefined){
    g.f4.role=RUOLI_F4.find(r=>P().some(p=>gotTot(p.id,r)<TOT[r]))||null;
    g.f4.bandIdx=0;g.f4.band=[];g.f4.cur=null;
    if(g.phase===4&&g.f4.role){fillBand();g.f4.cur=g.f4.band.length?g.f4.band[0]:null;}
  }
  if(g.f4.role===undefined)g.f4.role='D';
  if(g.f4.bandIdx===undefined)g.f4.bandIdx=0;
  if(!g.f4.band)g.f4.band=[];
  if(!g.f4.bandDrawn)g.f4.bandDrawn=[];
  return g;
}
function importG(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{G=JSON.parse(r.result);normalizzaF4(G);HIST=[];render();toast('Sessione caricata');}catch(e){toast('File non valido');}};r.readAsText(f);}

/* ---------------- caricamento di un nuovo listone ----------------
   Il listone (LISTONE/PL/byId/KITS/FASCE/ROLE_RANK) è incorporato nel file
   al momento della creazione: per "recepire un aggiornamento" senza dover
   rigenerare tutto il file, l'admin può caricare da Impostazioni un .csv
   con le nuove quotazioni — lo stesso export "Quotazioni" che si scarica
   da fantacalcio.it, o un csv equivalente con almeno le colonne Id, R,
   Nome (Qt.A e FVM se presenti). Caricare un nuovo listone comporta per
   forza un Azzera: le rose già fatte fanno riferimento ai calciatori del
   listone precedente e non avrebbero più senso con quello nuovo. */
let PENDING_LISTONE=null;
const RUOLO_ALIAS={P:'P',D:'D',C:'C',A:'A',POR:'P',DIF:'D',CEN:'C',ATT:'A',GK:'P'};
function parseCSVLine(line,delim){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}
      else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===delim){out.push(cur);cur='';}
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function parseListoneCSV(text){
  const lines=text.split(/\r\n|\r|\n/).filter(l=>l.trim().length);
  if(lines.length<2)return{error:'File vuoto o senza righe di dati.'};
  const headerLine=lines[0];
  const semi=(headerLine.match(/;/g)||[]).length,comma=(headerLine.match(/,/g)||[]).length;
  const delim=semi>=comma?';':',';
  const norm=h=>h.toLowerCase().trim().replace(/[^a-z0-9]/g,'');
  const headers=parseCSVLine(headerLine,delim).map(norm);
  const idx=name=>headers.indexOf(name);
  const iId=idx('id'),iR=idx('r'),iNome=idx('nome'),iSquadra=idx('squadra'),iQta=idx('qta'),iFvm=idx('fvm');
  if(iId<0||iR<0||iNome<0||iQta<0)
    return{error:'Colonne non riconosciute: servono almeno Id, R, Nome e Qt.A (va bene l\'export "Quotazioni" di Fantacalcio.it così com\'è).'};
  const rows=[];let skipped=0;
  for(let i=1;i<lines.length;i++){
    const cells=parseCSVLine(lines[i],delim);
    const id=parseInt(cells[iId],10);
    const ruolo=RUOLO_ALIAS[(cells[iR]||'').trim().toUpperCase()];
    const nome=(cells[iNome]||'').trim();
    if(!id||!ruolo||!nome){skipped++;continue;}
    const squadra=iSquadra>=0?(cells[iSquadra]||'').trim():'';
    const qta=Number((cells[iQta]||'0').replace(',','.'))||0;
    const fvm=iFvm>=0?(Number((cells[iFvm]||'').replace(',','.'))||qta):qta;
    rows.push([id,ruolo,nome,squadra,qta,fvm]);
  }
  if(rows.length<50)return{error:`Solo ${rows.length} righe valide trovate: il file non sembra un listone completo.`};
  return{rows,skipped};
}
function applicaListone(tuples){
  LISTONE=tuples;
  buildDerived();
  reset();
  logit(`Listone aggiornato · ${PL.length} calciatori (${PL.filter(p=>p.r==='P').length} P, ${PL.filter(p=>p.r==='D').length} D, ${PL.filter(p=>p.r==='C').length} C, ${PL.filter(p=>p.r==='A').length} A)`);
  render();
  toast('Nuovo listone caricato · lega azzerata');
}
function importListone(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    inp.value='';
    const res=parseListoneCSV(String(r.result));
    if(res.error)return toast(res.error);
    PENDING_LISTONE=res.rows;
    const c={P:0,D:0,C:0,A:0};res.rows.forEach(x=>c[x[1]]++);
    askConfirm('listone',`Caricare questo listone? ${res.rows.length} calciatori (${c.P} P, ${c.D} D, ${c.C} C, ${c.A} A)${res.skipped?`, ${res.skipped} righe scartate`:''}. La lega ripartirà da zero: rose e scelte fatte finora andranno perse.`);
  };
  r.readAsText(f,'utf-8');
}

/* ---------------- persistenza locale + sincronizzazione tra tab ---------------- */
/* Lo stato di gioco (G) viene salvato in localStorage a ogni render e ricaricato
   all'apertura. Quando un'altra tab dello STESSO browser (stesso dispositivo)
   lo modifica, l'evento 'storage' lo ricarica qui: più tab aperte sullo stesso
   computer (una per l'admin, una per ogni giocatore, una per il tabellone)
   restano quindi allineate in tempo reale. Non sincronizza fra dispositivi
   diversi: per quello serve il backend descritto in fantabun-architettura.md. */
function save(){try{localStorage.setItem('fantabun_state',JSON.stringify(G));}catch(e){}}
window.addEventListener('storage',e=>{
  if(e.key==='fantabun_state'&&e.newValue){
    try{G=JSON.parse(e.newValue);render();}catch(err){}
  }
});
function boot(){
  let saved=null;
  try{saved=localStorage.getItem('fantabun_state');}catch(e){}
  if(saved){try{G=JSON.parse(saved);}catch(e){G=null;}}
  if(!G)G=freshG();
  normalizzaF4(G);
  HIST=[];
  /* L'identita' e' gia' stata risolta dal server in avvia(): qui si
     applica soltanto. Chi ha un token valido finisce bloccato sulla
     propria vista; tabellone e listone restano pubblici. */
  const vista=(new URLSearchParams(location.search).get('vista')||'').toLowerCase();
  if(vista==='tv'||vista==='listone'){S.screen='game';S.view=vista;S.locked=true;}
  else if(IDENTITA){
    S.screen='game';
    if(IDENTITA.is_admin)S.view='admin';
    else{
      const idx=PARTECIPANTI.findIndex(p=>p.id===IDENTITA.id);
      if(idx>=0){S.view='player';S.who=idx;S.locked=true;}
    }
  }
  render();
}

async function caricaDati(){
  const [cal, par, leg] = await Promise.all([
    sb.from('calciatore')
      .select('ext_id,ruolo,nome,squadra,qta,fvm')
      .eq('lega_id', LEGA_ID).limit(2000),
    sb.from('v_partecipante')
      .select('id,nome,berbero,crediti,is_admin')
      .eq('lega_id', LEGA_ID).order('created_at'),
    sb.from('lega').select('*').eq('id', LEGA_ID).single()
  ]);
  for(const r of [cal, par, leg]) if(r.error) throw r.error;
  if(!cal.data.length)  throw new Error('Listone vuoto: eseguire fantabun-seed.sql');
  if(par.data.length !== 10) throw new Error('Trovati ' + par.data.length + ' partecipanti invece di 10');

  /* stesso formato dell'array che stava incollato qui: [id,R,nome,squadra,Qt.A,FVM] */
  LISTONE = cal.data.map(c => [c.ext_id, c.ruolo, c.nome, c.squadra, c.qta, c.fvm]);
  PARTECIPANTI = par.data;
  NOMI = par.data.map(p => p.nome);
  LEGA = leg.data;
  buildDerived();   /* ricalcola PL, KITS, FASCE dal listone appena arrivato */
}

/* Ogni modifica alla riga della lega arriva qui senza ricaricare la pagina.
   E' il canale su cui viaggeranno, piu' avanti, le mosse di gioco. */
function ascoltaRealtime(){
  sb.channel('lega-' + LEGA_ID)
    .on('postgres_changes',
        {event:'UPDATE', schema:'public', table:'lega', filter:'id=eq.'+LEGA_ID},
        payload => {
          LEGA = payload.new;
          stato('aggiornato · ' + LEGA.stato, 'var(--verde)');
          render();
        })
    .subscribe(s => {
      if(s === 'SUBSCRIBED') stato('collegato · ' + (LEGA ? LEGA.stato : ''), 'var(--verde)');
      if(s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') stato('sincronia interrotta', 'var(--rosso)');
    });
}

/* Chiede al server chi e' il possessore di questo token. La tabella
   partecipante non e' leggibile dal browser: solo la Edge Function,
   che gira sul server, puo' rispondere. */
async function chiSono(token){
  const r = await fetch(SB_URL + '/functions/v1/chi-sono', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    body: JSON.stringify({token})
  });
  if(!r.ok) return null;
  return await r.json();
}
