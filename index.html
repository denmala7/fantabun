<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantabun 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bosco:#123B23;--bosco-2:#0D2A19;--bosco-3:#1B5230;
  --oro:#D6A31A;--oro-2:#F0C64A;--crema:#F3F1E8;--crema-2:#E7E3D4;
  --inch:#15150F;--rosso:#AF3A2C;--blu:#22699F;--verde:#2C9257;--grigio:#6E6B5E;
  --display:"Bodoni Moda",Georgia,serif;--ui:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--crema);color:var(--inch);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.proto{position:sticky;top:0;z-index:60;background:var(--bosco-2);color:var(--crema);display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:9px 18px;border-bottom:1px solid rgba(214,163,26,.3)}
.proto__tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);border:1px solid rgba(214,163,26,.45);padding:3px 8px;border-radius:2px}
.proto__lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,241,232,.45)}
.proto__spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:3px;padding:2px}
.seg button{padding:5px 12px;border-radius:2px;font-size:13px;font-weight:500;color:rgba(243,241,232,.65);transition:.15s}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--bosco-2);font-weight:600}
.proto select{background:rgba(255,255,255,.07);color:var(--crema);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:5px 8px;font-size:13px}
.proto select option{color:#000}

.shell{max-width:1240px;margin:0 auto;padding:26px 20px 90px;display:grid;grid-template-columns:1fr 300px;gap:30px}
.shell--wide{grid-template-columns:1fr}
@media(max-width:960px){.shell{grid-template-columns:1fr;padding:18px 14px 60px}}

.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
h1.title{font-family:var(--display);font-size:clamp(28px,4.2vw,44px);font-weight:700;line-height:1.03;margin:6px 0 0;letter-spacing:-.01em}
h2.sub{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 12px}
.lede{color:var(--grigio);margin:10px 0 0}

.card{background:#fff;border:1px solid var(--crema-2);border-radius:6px;padding:19px}
.card+.card{margin-top:15px}
.card__hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}

.stub{display:grid;grid-template-columns:1fr 14px 1fr;border-radius:5px;overflow:hidden;background:var(--bosco)}
.stub__half{padding:15px 17px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.stub__half--got{background:var(--bosco);color:var(--crema)}
.stub__half--owe{background:repeating-linear-gradient(135deg,rgba(214,163,26,.07) 0 7px,transparent 7px 14px),var(--bosco-2);color:var(--oro-2);border:1px dashed rgba(214,163,26,.55);border-left:0;border-radius:0 5px 5px 0}
.stub__tear{background:var(--bosco);position:relative}
.stub__tear::before{content:"";position:absolute;inset:0;left:6px;width:2px;background-image:linear-gradient(var(--crema) 55%,transparent 0);background-size:2px 8px}
.stub__k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
.stub__v{font-family:var(--display);font-size:25px;font-weight:700;line-height:1}
.stub__n{font-size:13px;opacity:.85}

.fa{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 7px;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;background:var(--bosco);color:var(--oro-2);flex:none}
.fa--b{background:var(--crema-2);color:var(--bosco)}
.fa--free{background:transparent;color:var(--grigio);border:1px dashed var(--crema-2)}
.ru{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;flex:none}
.ru--P{background:var(--oro);color:var(--bosco-2)}.ru--D{background:var(--verde)}.ru--C{background:var(--blu)}.ru--A{background:var(--rosso)}

.turno{border-radius:6px;padding:17px 19px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--bosco);color:var(--crema)}
.turno--tuo{background:var(--oro);color:var(--bosco-2);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(214,163,26,.55)}50%{box-shadow:0 0 0 9px rgba(214,163,26,0)}}
.turno__t{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.05;margin:0}
.turno__s{font-size:13px;opacity:.82;margin:2px 0 0}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:4px;font-weight:600;font-size:14px;background:var(--bosco);color:var(--crema);transition:.15s}
.btn:hover{background:var(--bosco-3)}
.btn--oro{background:var(--oro);color:var(--bosco-2)}.btn--oro:hover{background:var(--oro-2)}
.btn--ghost{background:transparent;color:var(--bosco);border:1px solid var(--crema-2)}.btn--ghost:hover{background:var(--crema)}
.btn--dark{background:transparent;color:var(--crema);border:1px solid rgba(255,255,255,.22)}.btn--dark:hover{background:rgba(255,255,255,.08)}
.btn--sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:not-allowed}

.row{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--crema-2);flex-wrap:wrap;row-gap:2px}
.row:last-child{border-bottom:0}
.row>*{min-width:0}
.row__n,.row__m{overflow-wrap:break-word}
.row__n{font-weight:500}.row__m{font-size:12px;color:var(--grigio)}.row__sp{flex:1}
.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.mut{color:var(--grigio)}
.pick{width:100%;text-align:left;border-radius:4px;padding:8px 10px;transition:.12s;display:flex;align-items:center;gap:11px}
.pick:hover{background:var(--crema)}
.pick[disabled]{opacity:.3}
.scroll{max-height:340px;overflow:auto}
.scroll--tall{max-height:560px}
.search{width:100%;padding:10px 13px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);margin-bottom:6px}
.inp{padding:9px 11px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);width:96px}
.selbox{padding:8px 10px;border:1px solid var(--crema-2);border-radius:4px;background:var(--crema);color:var(--inch)}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--crema-2);color:var(--grigio);transition:.12s}
.chip[aria-pressed=true]{background:var(--bosco);color:var(--crema);border-color:var(--bosco)}

.rail{position:sticky;top:66px;align-self:start}
@media(max-width:960px){.rail{position:static}}
.crediti{background:var(--bosco);color:var(--crema);border-radius:6px;padding:15px 17px;margin-bottom:13px}
.crediti__n{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--oro-2)}
.crediti__k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
.slots{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 6px 30px}
.slot{width:14px;height:14px;border-radius:2px;background:var(--crema-2)}
.slot--f{background:var(--bosco)}
.slot--cap{background:var(--oro);box-shadow:inset 0 0 0 2px var(--bosco)}
.repline{display:flex;align-items:center;gap:9px;padding:6px 0}
.repline+.repline{border-top:1px solid var(--crema-2)}

.tv{background:var(--bosco-2);color:var(--crema);min-height:calc(100vh - 44px);padding:32px 40px}
.tv__hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid rgba(214,163,26,.28);padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap}
.tv__t{font-family:var(--display);font-size:clamp(30px,4.6vw,54px);font-weight:700;line-height:.98;margin:4px 0 0}
.tv__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.tvc{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:13px 15px}
.tvc--live{background:var(--oro);color:var(--bosco-2);border-color:var(--oro)}
.tvc__n{font-family:var(--display);font-size:21px;font-weight:600;margin:0}
.tvc__v{font-family:var(--mono);font-size:11.5px;opacity:.7}
.tvc__b{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.tvc__grp{display:flex;gap:3px;padding:2px 3px;border-radius:3px;background:rgba(255,255,255,.04)}
.tvc--live .tvc__grp{background:rgba(0,0,0,.06)}
.tvc__b i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.18);font-style:normal;display:block}
.tvc--live .tvc__b i{background:rgba(0,0,0,.14)}
.tvc{width:100%;transition:.12s}
.tvc:hover{border-color:rgba(214,163,26,.5)}
.tvModal{position:fixed;inset:0;background:rgba(13,42,25,.72);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.tvModal__card{background:var(--crema);color:var(--inch);border-radius:8px;padding:22px 24px;max-width:520px;width:100%;max-height:80vh;overflow:auto}

.gonf{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.gonf i{width:13px;height:18px;display:block;clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--grigio);font-style:italic;margin-top:10px}
.tabs{display:flex;gap:2px;margin-bottom:13px;border-bottom:1px solid var(--crema-2);flex-wrap:wrap}
.tabs button{padding:8px 13px;font-size:13px;font-weight:500;color:var(--grigio);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed=true]{color:var(--inch);border-bottom-color:var(--oro);font-weight:600}
.adminbar{background:var(--bosco-2);color:var(--crema);border-radius:6px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.adminbar__k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.warn{border-color:var(--rosso);background:rgba(175,58,44,.06)}
.ok{border-color:var(--verde);background:rgba(44,146,87,.06)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bosco-2);color:var(--crema);padding:11px 20px;border-radius:4px;font-size:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* --- copertina --- */
.cop{min-height:100vh;background:radial-gradient(circle at 50% 44%,var(--bosco-3) 0%,var(--bosco) 46%,var(--bosco-2) 100%);color:var(--crema);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px 20px 54px;text-align:center;position:relative;overflow:hidden}
.cop::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(214,163,26,.045) 0 1px,transparent 1px 13px)}
.cop__in{position:relative;width:100%;max-width:780px}
.cop__t{font-family:var(--display);font-size:clamp(34px,7vw,62px);font-weight:700;line-height:1;margin:9px 0 0;letter-spacing:-.015em}
.cop__s{color:rgba(243,241,232,.62);font-size:16px;margin:12px 0 0}
.cop__rule{width:54px;height:1px;background:rgba(214,163,26,.55);margin:20px auto 0}
.cop__ring{position:relative;width:min(92vw,680px);aspect-ratio:1;margin:30px auto 0}
.cop__hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;z-index:2}
.cop__sq{position:absolute;transform:translate(-50%,-50%);width:19%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;transition:.16s}
.cop__sq:hover{filter:brightness(1.12)}
.cop__sq:hover .cop__disc{border-color:rgba(214,163,26,.7);box-shadow:0 0 0 4px rgba(214,163,26,.14),0 6px 20px rgba(0,0,0,.34)}
.cop__sq:hover .cop__nm{color:var(--oro-2)}
.cop__disc{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(243,241,232,.055);border:1.5px solid rgba(243,241,232,.16);box-shadow:0 4px 16px rgba(0,0,0,.28);position:relative}
.cop__disc img{width:100%;height:100%;object-fit:cover;display:block}
.cop__disc--hub{border:2px solid rgba(214,163,26,.75);background:radial-gradient(circle at 50% 34%,rgba(214,163,26,.2),rgba(13,42,25,.9));box-shadow:0 0 0 7px rgba(214,163,26,.09),0 10px 34px rgba(0,0,0,.42)}
.cop__disc--img{background:none;border-color:rgba(243,241,232,.28)}
.cop__disc--fit img{object-fit:contain;padding:11%}
.cop__mono{font-family:var(--display);font-weight:700;color:var(--crema);line-height:1;font-size:min(4.2vw,26px)}
.cop__disc--hub .cop__mono{font-size:min(9vw,54px);color:var(--oro-2)}
.cop__flag{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;opacity:.9;mask:radial-gradient(circle at 50% 50%,transparent 0 62%,#000 62%);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 62%,#000 62%)}
.cop__nm{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:rgba(243,241,232,.7);line-height:1.18;width:100%;max-width:130px;margin:0;min-width:0;transition:.16s;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.cop__cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cop__note{margin-top:18px;font-size:11.5px;color:rgba(243,241,232,.38);font-family:var(--mono);letter-spacing:.05em}
.copModal{position:fixed;inset:0;background:rgba(6,20,12,.82);z-index:140;display:flex;align-items:center;justify-content:center;padding:20px;text-align:left}
.copModal__card{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bosco-2);border:1px solid rgba(214,163,26,.34);border-radius:9px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.copModal__x{position:absolute;right:9px;top:7px;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;color:rgba(243,241,232,.72);background:rgba(0,0,0,.35);z-index:2}
.copModal__x:hover{color:var(--crema);background:rgba(0,0,0,.55)}
.copModal__foto{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;background:var(--bosco-2);border-bottom:1px solid rgba(214,163,26,.3)}
.copModal__hd{display:flex;gap:14px;align-items:center;padding:16px 18px 0}
.copModal__t{font-family:var(--display);font-size:27px;font-weight:700;margin:3px 0 4px;line-height:1.05;color:var(--crema)}
.copModal__c{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,241,232,.55)}
.copModal__b{padding:12px 20px 22px;margin:0;font-size:15px;line-height:1.6;color:rgba(243,241,232,.78)}
@media(max-width:700px){
  .cop__ring{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:16px 9px;place-items:start center;margin-top:22px}
  .cop__hub{position:static!important;left:auto!important;top:auto!important;transform:none!important;width:min(56vw,210px);grid-column:1/-1;margin-bottom:14px}
  .cop__sq{position:static!important;left:auto!important;top:auto!important;transform:none!important;width:100%}
  .cop__nm{font-size:8px;letter-spacing:.02em;width:104%;margin:0 -2%}
  .cop__mono{font-size:6.4vw}
  .cop__disc--hub .cop__mono{font-size:11vw}
}
</style>
<style>
/* --- barra dei tab in alto --- */
.nav{position:sticky;top:0;z-index:60;background:var(--bosco-2);color:var(--crema);border-bottom:1px solid rgba(214,163,26,.3)}
.nav__in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:18px}
.nav__brand{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);border:1px solid rgba(214,163,26,.45);padding:3px 8px;border-radius:2px;flex:none}
.nav__tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav__tabs::-webkit-scrollbar{display:none}
.nav__tab{padding:15px 13px 13px;font-size:13.5px;font-weight:500;color:rgba(243,241,232,.62);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.nav__tab:hover{color:var(--crema)}
.nav__tab[aria-current=page]{color:var(--crema);border-bottom-color:var(--oro);font-weight:600}
@media(max-width:560px){.nav__in{padding:0 12px;gap:10px}.nav__brand{display:none}.nav__tab{padding:14px 10px 12px;font-size:13px}}
.cop{min-height:calc(100vh - 50px)}

/* --- commento giornate --- */
.page{max-width:780px;margin:0 auto;padding:34px 20px 90px}
@media(max-width:560px){.page{padding:24px 16px 60px}}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.jump a{text-decoration:none}
.gio{background:#fff;border:1px solid var(--crema-2);border-radius:6px;padding:24px 26px;margin-top:18px;scroll-margin-top:70px}
@media(max-width:560px){.gio{padding:19px 18px}}
.gio__hd{display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--crema-2);padding-bottom:14px;margin-bottom:14px}
.gio__n{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--bosco);flex:none;min-width:50px}
.gio__n sup{font-size:.42em;color:var(--oro);margin-left:1px}
.gio__t{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15;margin:3px 0 0}
.gio__b p{margin:0 0 12px;line-height:1.65}
.gio__b p:last-child{margin-bottom:0}
.gio__b strong{color:var(--bosco)}

/* --- stato vuoto --- */
.vuoto{background:var(--bosco);color:var(--crema);border-radius:8px;padding:48px 28px;text-align:center;margin-top:24px;position:relative;overflow:hidden}
.vuoto::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(214,163,26,.05) 0 1px,transparent 1px 13px)}
.vuoto>*{position:relative}
.vuoto__ico{width:54px;height:54px;margin:0 auto 16px;display:flex;align-items:flex-end;justify-content:center;gap:5px}
.vuoto__ico i{width:10px;border-radius:2px 2px 0 0;background:var(--oro);display:block;animation:grow 2.4s ease-in-out infinite}
.vuoto__ico i:nth-child(1){height:40%}.vuoto__ico i:nth-child(2){height:75%;animation-delay:.3s}.vuoto__ico i:nth-child(3){height:55%;animation-delay:.6s}.vuoto__ico i:nth-child(4){height:95%;animation-delay:.9s}
@keyframes grow{0%,100%{transform:scaleY(1);transform-origin:bottom}50%{transform:scaleY(.55);transform-origin:bottom}}
.vuoto__t{font-family:var(--display);font-size:clamp(24px,4vw,32px);font-weight:700;margin:6px 0 8px;line-height:1.1}
.vuoto__s{color:rgba(243,241,232,.7);margin:0 auto;max-width:430px}

.disclaimer{font-size:13px;font-style:italic;line-height:1.55;color:var(--grigio);border-left:2px solid var(--oro);padding:2px 0 2px 12px;margin:16px 0 0;max-width:640px}
/* --- tabellino --- */
.ml{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;display:inline-flex;background:var(--crema-2);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.ml img{width:100%;height:100%;object-fit:cover;display:block}
.ml__fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:700;font-size:11px}
.ml--l{width:58px;height:58px;box-shadow:0 0 0 2px rgba(243,241,232,.18)}
.ml--l .ml__fb{font-size:20px}

  "Nicchio": {"club": "Legralume", "allenatore": "Lore e Bonni", "bio": "I padri fondatori. I campioni. Ora, una coppia.\nPrima acerrimi avversari, oggi allenatore e vice: una fusione di numeri, statistiche e creatività. Lore ha alzato la coppa nel 21/22, Bonni nel 22/23: due stelle, due menti, un unico obiettivo. Lui fa magie con i numeri, lei ogni tanto tira fuori il colpo di genio. Insieme potrebbero essere devastanti. O semplicemente litigare sulla formazione."},
  "Civetta": {"club": "Avvoltoi", "allenatore": "Denis", "bio": "Il ritorno dell'Avvoltoio.\nSocio onorario del Fantabun e veterano dai tempi del Fantaindie, Denis torna alla guida solitaria dopo l'esperimento in coppia dello scorso anno, conclusosi con il suo peggior piazzamento di sempre. Coincidenze? Lui dice di no. Ingegnere, informatico e mente dietro la piattaforma dell'asta, quest'anno avrà al suo fianco anche il fido Claude. La tecnologia è dalla sua parte. Ora resta solo da capire se riuscirà a usarla anche per vincere."},
  "Oca": {"club": "Newkirk Plaza", "allenatore": "Andre", "bio": "Il maestro della confusione.\nSince 21/22, Andre detiene un record difficilmente battibile: il maggior numero di formazioni NON schierate nella storia del Fantabun. Eppure, nonostante tutto, l'anno scorso ha chiuso a metà classifica. Strategia? Nessuno lo sa. Non mette la formazione, confonde gli avversari e poi, puntualmente, dice la sua. Un metodo incomprensibile. Forse proprio per questo funziona."},
  "Onda": {"club": "Willwaukee Bucks FC", "allenatore": "Chry", "bio": "Dal canguro al cervo, passando per BUN.\nSocio onorario della prima ora e soprattutto colui che ha portato con sé BUN, lo sponsor che ha dato il nome alla nostra gloriosa lega. Un legame ormai indissolubile, nonostante ai tempi BUN sponsorizzasse decisamente di più. Partito come SeaKangaroos FC, con tanto di canguro surfista, Chry ha vissuto una sorprendente evoluzione zoologica trasformandosi in un cervo. E proprio da cervo è arrivata, lo scorso anno, la sua prima vittoria: individuale e di coppia. La metamorfosi è completa."},
  "Tartuca": {"club": "Los Caninos", "allenatore": "Nico", "bio": "L'uomo dei record.\nNato come opinionista e ospite nel 21/22, diventa membro ufficiale nel 23/24. E decide di non perdere tempo: entra e vince. L'anno dopo? Vince ancora. Primo nella storia del Fantabun a conquistare due stelle e due competizioni consecutive. Studioso, appassionato e maniaco delle aste, sembrava inarrestabile. Poi qualcosa si è rotto. Ma attenzione: i campioni veri sanno sempre tornare. E Nico ha ancora fame."},
  "Istrice": {"club": "Notthingatto Forest", "allenatore": "Sean", "bio": "Crisi d'identità, ma con ambizioni.\nArrivato nel 23/24, Sean ha già cambiato più nomi di squadra di quanti alcuni abbiano cambiato portieri. Prima LeBaguette, poi Paris-Sean Germain per due stagioni e ora… Nottingham Forest. Una vera crisi d'identità calcistica. Ma forse è proprio questo il cambio di marcia che serviva: nuovo nome, nuova stagione, nuovo Sean. L'obiettivo è chiaro: finalmente entrare in Top 5."},
  "Selva": {"club": "Los Miedosos", "allenatore": "Edo", "bio": "Da spalla a protagonista.\nArrivato in aiuto a Denis nel 25/26, più che trascinarlo alla vittoria ha finito per accompagnarlo fino all'ultimo posto. Ma quest'anno Edo ha deciso di mettersi in proprio e prendersi finalmente il ruolo di primo allenatore. Una nuova veste, una nuova sfida e soprattutto una domanda: e se la vera vittima fosse sempre stata lui? Quest'anno lo scopriremo."},
  "Giraffa": {"club": "Manzester City", "allenatore": "Zino", "bio": "Il nuovo che avanza.\nNew entry del Fantabun, Zino arriva direttamente dalla pediatria neonatale, dove evidentemente serve una mano chirurgicamente precisa. E di precisione, a quanto pare, ne ha già mostrata parecchia: idee nuove, innovazione e voglia di lasciare il segno. Nessuno sa ancora cosa aspettarsi da lui. Ed è probabilmente questo il suo primo vantaggio."},
  "Bruco": {"club": "I Bagassi", "allenatore": "Lori Fadda", "bio": "È arrivato con le idee molto chiare.\nNew entry del Fantabun, Lori Fadda non ha perso tempo a dichiarare il suo vero obiettivo: una cena al mese offerta dallo sponsor BUN. Ambizione? Certamente. Strategia? Ancora da verificare. Sicurezza in sé? Assoluta. A dimostrarlo, un logo già pronto e curato nei minimi dettagli. Ora manca solo una cosa: costruire una squadra all'altezza del brand."},
  "Leocorno": {"club": "Da Rio", "allenatore": "Dario", "bio": "Arrivo Tardi, ma forse non troppo.\nQuarto socio onorario della prima ora, Dario si presenta nel 21/22 con un nome che non lasciava spazio a interpretazioni: Arrivo Tardi. Dal 23/24 cambia identità e diventa RIO, e negli ultimi anni ha iniziato a tirar fuori qualche colpo in più. Quest'anno avrà molto da dimostrare: da tenere d'occhio. RIO è pronto a dare spettacolo…\nLogo e nome della squadra? Ovviamente, per ultimi. La tradizione va rispettata."}

/* ---------------- utilità ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iniziali(s){
  const w=String(s||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length)return '?';
  return (w.length===1?w[0].slice(0,2):w[0][0]+w[1][0]).toUpperCase();
}
/* Il file del logo si chiama come la squadra: minuscolo, spazi in underscore. */
const slug=c=>c.toLowerCase().trim().replace(/\s+/g,'_');
const fileLogo=c=>c?'img/'+slug(c)+'.jpeg':null;
const fileRitratto=c=>c?'img/'+slug(c)+'_ritratto.jpeg':null;

/* ---------------- home ---------------- */
function discoLogo(src,alt,extra,fallback){
  const cl=(extra||'')+(src?' cop__disc--img':'');
  const rip=`this.parentNode.classList.remove('cop__disc--img','cop__disc--fit');this.outerHTML=this.dataset.fb;`;
  return `<div class="cop__disc ${cl}">${
    src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-fb="${esc(fallback||'')}" onerror="${rip}">`:fallback
  }</div>`;
}

    return `<button class="cop__sq" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%" onclick="copOpen(${t.id})" title="${esc(t.club)} — apri la scheda">
      ${discoLogo(fileLogo(t.club),t.club,'',fb)}

  return `<div class="cop"><div class="cop__in">
    <span class="eyebrow">Stagione 26/27</span>

}

/* ---------------- commento giornate: lettura ---------------- */
async function caricaGiornate(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/commento?select=giornata,data,titolo,testo,contenuto&lega_id=eq.${LEGA_ID}&order=giornata.desc`,
      {headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    GIORNATE=(await r.json()).map(daRiga);
    ERR_G=false;
  }catch(e){console.error(e);ERR_G=true;if(!GIORNATE)GIORNATE=[];}
  render();
}
const daRiga=c=>({n:c.giornata,data:c.data,titolo:c.titolo,testo:c.testo||'',contenuto:c.contenuto||null});

function testoHTML(t){
  return String(t||'').trim().split(/\n\s*\n/).filter(Boolean).map(p=>
    `<p>${esc(p.trim()).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</p>`).join('');
}
const fmt=v=>v===null||v===undefined||v===''?'–':String(v).replace('.',',');
/* squadra per contrada → {club, allenatore, contrada, colore} */
function sq(contrada){
  const s=SQUADRE[contrada];
  return s?{contrada,club:s.club,allenatore:s.allenatore,col:CONTRADE[contrada]||'#6E6B5E'}
          :{contrada:contrada||'',club:contrada||'—',allenatore:'',col:'#6E6B5E'};
}
function miniLogo(contrada,cls){
  const s=sq(contrada);
  const fb=`<span class="ml__fb" style="background:${s.col}">${esc(iniziali(s.allenatore||s.club))}</span>`;
  return `<span class="ml ${cls||''}">${SQUADRE[contrada]
    ?`<img src="${esc(fileLogo(s.club))}" alt="" loading="lazy" data-fb="${esc(fb)}" onerror="this.outerHTML=this.dataset.fb">`:fb}</span>`;
}
const vince=(g,i)=>g&&g[0]!=null&&g[1]!=null&&g[i]>g[1-i];

function partitaDelGiorno(p){
  if(!p||(!p.casa&&!p.ospite))return'';
  const lato=i=>{const c=i?p.ospite:p.casa,s=sq(c);
    return `<div class="pdg__sq ${vince(p.gol,i)?'pdg__sq--win':''}">${miniLogo(c,'ml--l')}
      <span class="pdg__club">${esc(s.club)}</span><span class="pdg__all">${esc(s.allenatore||'')}</span></div>`;};
  const chip=(k,v,cl)=>v?`<span class="pdg__chip ${cl}"><b>${k}</b> ${esc(v)}</span>`:'';
  return `<div class="pdg"><span class="eyebrow">Partita del giorno</span>
    <div class="pdg__row">${lato(0)}
      <div class="pdg__mid"><div class="pdg__gol">${fmt(p.gol&&p.gol[0])}<i>–</i>${fmt(p.gol&&p.gol[1])}</div>
        <div class="pdg__pt">${fmt(p.punti&&p.punti[0])} · ${fmt(p.punti&&p.punti[1])}<br><span>fantapunti</span></div></div>
      ${lato(1)}</div>
    ${(p.mvp||p.flop)?`<div class="pdg__chips">${chip('MVP',p.mvp,'')}${chip('Flop',p.flop,'pdg__chip--flop')}</div>`:''}
  </div>`;
}
function altraSfida(s){
  const lato=i=>{const c=i?s.ospite:s.casa;
    return `<div class="sf__sq sf__sq--${i?'r':'l'} ${vince(s.gol,i)?'sf__sq--win':''}">${miniLogo(c)}<span>${esc(sq(c).club)}</span></div>`;};
  return `<div class="sf"><div class="sf__row">${lato(0)}
      <div class="sf__mid"><div class="sf__gol">${fmt(s.gol&&s.gol[0])} – ${fmt(s.gol&&s.gol[1])}</div>
      <div class="sf__pt">${fmt(s.punti&&s.punti[0])} · ${fmt(s.punti&&s.punti[1])}</div></div>
      ${lato(1)}</div>
    ${s.nota?`<p class="sf__nota">${esc(s.nota).replace(/\n/g,'<br>')}</p>`:''}</div>`;
}
function articolo(g){
  const c=g.contenuto||{};
  const altre=(c.altre||[]).filter(s=>s.casa||s.ospite||s.nota);
  return `<article class="gio" id="g${g.n}">
    <div class="gio__hd"><div class="gio__n">${g.n}<sup>a</sup></div>
      <div style="min-width:0"><span class="eyebrow">Giornata ${g.n}${g.data?' · '+esc(g.data):''}</span>
      ${g.titolo?`<h2 class="gio__t">${esc(g.titolo)}</h2>`:''}</div></div>
    ${partitaDelGiorno(c.partita)}
    ${g.testo&&g.testo.trim()?`<div class="gio__b">${testoHTML(g.testo)}</div>`:''}
    ${altre.length?`<h3 class="gio__sub">Le altre sfide</h3><div class="sfide">${altre.map(altraSfida).join('')}</div>`:''}
  </article>`;
}
function giornate(){
  const testa=`<span class="eyebrow">Stagione 26/27</span><h1 class="title">Commento giornate</h1>
    <p class="lede">Il racconto della lega, una giornata alla volta.</p>
    <p class="disclaimer">©️ Telecronache appositamente provocatorie, scritte con moderata malizia e abbondante ironia. Ogni riferimento a rosicate, morali flessibili e polemiche selettive è puramente voluto... ma non mina in alcun modo la vera amicizia che ci lega ❤️</p>`;
  if(GIORNATE===null) return `<div class="page">${testa}<div class="caric">Carico i commenti…</div></div>`;
  if(ERR_G&&!GIORNATE.length) return `<div class="page">${testa}<div class="errbox"><b>Non riesco a caricare i commenti.</b>
    <p class="mut" style="margin:6px 0 14px">Controlla la connessione e riprova tra poco.</p>
    <button class="btn btn--sm" onclick="GIORNATE=null;render();caricaGiornate()">Riprova</button></div></div>`;
  const list=GIORNATE.slice().sort((a,b)=>b.n-a.n);
  if(!list.length) return `<div class="page">${testa}${vuoto('Il primo commento arriva presto','Appena si chiude la prima giornata, qui trovi il racconto di com\'è andata.')}</div>`;
  const jump=list.length>3?`<div class="jump">${list.map(g=>`<a class="chip" href="#giornate/${g.n}" onclick="event.preventDefault();vaiA(${g.n})">G${g.n}</a>`).join('')}</div>`:'';
  return `<div class="page">${testa}${jump}${list.map(articolo).join('')}</div>`;
}
function vaiA(n){const el=document.getElementById('g'+n);if(el)el.scrollIntoView({behavior:'smooth'});}

/* ---------------- redazione ---------------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}

async function chiamaFunzione(corpo){
  const r=await fetch(SB_URL+'/functions/v1/commenti',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    body:JSON.stringify(Object.assign({token:TOKEN},corpo))});
  let risp={};try{risp=await r.json();}catch(e){}
  if(!r.ok)throw new Error(risp.errore||('Errore '+r.status));
  return risp;
}
/* Il token arriva dal link (?t=...) la prima volta e poi resta su questo
   dispositivo. Lo tolgo subito dalla barra degli indirizzi. */
async function verificaRedattore(){
  const q=new URLSearchParams(location.search);
  const daLink=q.get('t');
  if(daLink){
    q.delete('t');
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);
  }
  TOKEN=daLink||lsGet('fantabun_redazione');
  if(!TOKEN)return;
  try{
    RED=await chiamaFunzione({tipo:'chi_sono'});
    lsSet('fantabun_redazione',TOKEN);
    const bozza=lsGet('fantabun_bozza');
    if(bozza){try{F=normF(JSON.parse(bozza));}catch(e){}}
    if(daLink&&!location.hash)location.hash='scrivi';
    render();
  }catch(e){
    RED=null;
    if(/non valido/i.test(e.message)){lsSet('fantabun_redazione',null);if(daLink)toast('Questo link non permette di scrivere i commenti.');}
    TOKEN=null;
  }
}
function prossimaGiornata(){return Math.min(38,(GIORNATE&&GIORNATE.length?Math.max(...GIORNATE.map(g=>g.n)):0)+1);}
function esistente(n){return (GIORNATE||[]).find(g=>g.n===+n);}

/* --- stato del modulo ---
   F.p = partita del giorno, F.a = altre sfide. Numeri tenuti come testo
   finché non si salva, così l'utente può scrivere "75,5" senza sorprese. */
const sfidaVuota=()=>({casa:'',ospite:'',g1:'',g2:'',p1:'',p2:'',nota:''});
const fVuoto=()=>({n:'',data:'',titolo:'',testo:'',
  p:{casa:'',ospite:'',g1:'',g2:'',p1:'',p2:'',mvp:'',flop:''},
  a:[sfidaVuota(),sfidaVuota(),sfidaVuota(),sfidaVuota()]});
F=fVuoto();
function normF(o){
  const v=fVuoto();o=o||{};
  return {n:o.n??'',data:o.data??'',titolo:o.titolo??'',testo:o.testo??'',
    p:Object.assign(v.p,o.p||{}),
    a:Array.isArray(o.a)&&o.a.length?o.a.map(s=>Object.assign(sfidaVuota(),s)):v.a};
}
const sv=v=>v===null||v===undefined?'':String(v).replace('.',',');
function daGiornataAF(g){
  const c=g.contenuto||{},p=c.partita||{};
  const toS=s=>({casa:s.casa||'',ospite:s.ospite||'',g1:sv(s.gol&&s.gol[0]),g2:sv(s.gol&&s.gol[1]),
    p1:sv(s.punti&&s.punti[0]),p2:sv(s.punti&&s.punti[1]),nota:s.nota||''});
  const a=(c.altre||[]).map(toS);
  while(a.length<4)a.push(sfidaVuota());
  return {n:String(g.n),data:g.data||'',titolo:g.titolo||'',testo:g.testo||'',
    p:Object.assign(toS(p),{mvp:p.mvp||'',flop:p.flop||''}),a};
}
const num=v=>{const s=String(v??'').trim().replace(',','.');if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:null;};
function contenutoDaF(){
  const toC=s=>({casa:s.casa||null,ospite:s.ospite||null,gol:[num(s.g1),num(s.g2)],punti:[num(s.p1),num(s.p2)]});
  return {partita:Object.assign(toC(F.p),{mvp:F.p.mvp.trim()||null,flop:F.p.flop.trim()||null}),
    altre:F.a.filter(s=>s.casa||s.ospite||s.nota.trim()).map(s=>Object.assign(toC(s),{nota:s.nota.trim()||null}))};
}
function leggiForm(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  if(!document.getElementById('f-testo'))return;
  F.n=g('f-n');F.data=g('f-data');F.titolo=g('f-titolo');F.testo=g('f-testo');
  ['casa','ospite','g1','g2','p1','p2','mvp','flop'].forEach(k=>F.p[k]=g('p-'+k));
  F.a=[...document.querySelectorAll('[data-sfida]')].map((el,i)=>{
    const s={};['casa','ospite','g1','g2','p1','p2','nota'].forEach(k=>s[k]=g(`a${i}-${k}`));return s;});
}
/* aggiorna anteprima e pulsante senza ridisegnare il modulo
   (ridisegnarlo farebbe perdere il cursore mentre si scrive) */
function suInput(){
  leggiForm();
  lsSet('fantabun_bozza',JSON.stringify(F));
  const ex=esistente(F.n);
  const b=document.getElementById('f-pubblica');
  if(b&&!INVIO)b.textContent=ex?`Aggiorna giornata ${F.n}`:'Pubblica';
  const av=document.getElementById('f-avviso');
  if(av)av.style.display=ex?'':'none';
  const an=document.getElementById('f-anteprima');
  if(an){
    const c=contenutoDaF();
    const pieno=F.testo.trim()||c.partita.casa||c.partita.ospite||c.altre.length;
    an.innerHTML=pieno?articolo({n:+F.n||'?',data:F.data.trim(),titolo:F.titolo.trim(),testo:F.testo,contenuto:c})
      :'<div class="note">L\'anteprima compare qui mentre scrivi.</div>';
  }
}
function aggiungiSfida(){leggiForm();F.a.push(sfidaVuota());render();}
function togliSfida(i){leggiForm();F.a.splice(i,1);if(!F.a.length)F.a.push(sfidaVuota());render();}
function usate(){return [F.p.casa,F.p.ospite,...F.a.flatMap(s=>[s.casa,s.ospite])].filter(Boolean);}

async function pubblica(){
  leggiForm();
  const n=+F.n;
  if(!Number.isInteger(n)||n<1||n>38)return toast('Scegli una giornata da 1 a 38');
  const contenuto=contenutoDaF();
  const vuotaP=!contenuto.partita.casa&&!contenuto.partita.ospite;
  if(!F.testo.trim()&&vuotaP&&!contenuto.altre.length)return toast('Il commento è vuoto');
  const dup=usate().filter((c,i,a)=>a.indexOf(c)!==i);
  if(dup.length)return toast(`${sq(dup[0]).club} compare in due sfide`);
  INVIO=true;render();
  try{
    const r=await chiamaFunzione({tipo:'salva',giornata:n,data:F.data,titolo:F.titolo,testo:F.testo,contenuto});
    const nuova=daRiga(r.commento);
    GIORNATE=(GIORNATE||[]).filter(g=>g.n!==nuova.n).concat(nuova);
    F=fVuoto();lsSet('fantabun_bozza',null);
    INVIO=false;toast(`Giornata ${n} pubblicata`);
  }catch(e){INVIO=false;toast(e.message);}
}
function modifica(n){
  const g=esistente(n);if(!g)return;
  F=daGiornataAF(g);
  lsSet('fantabun_bozza',JSON.stringify(F));
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function svuota(){F=fVuoto();lsSet('fantabun_bozza',null);render();}
async function elimina(){
  const n=CONF;CONF=null;INVIO=true;render();
  try{
    await chiamaFunzione({tipo:'elimina',giornata:n});
    GIORNATE=(GIORNATE||[]).filter(g=>g.n!==n);
    INVIO=false;toast(`Giornata ${n} eliminata`);
  }catch(e){INVIO=false;toast(e.message);}
}
function esci(){lsSet('fantabun_redazione',null);lsSet('fantabun_bozza',null);TOKEN=null;RED=null;location.hash='giornate';render();}

function selSquadra(id,val){
  const opz=Object.entries(SQUADRE).map(([k,s])=>({k,club:s.club,all:s.allenatore}))
    .sort((a,b)=>a.club.localeCompare(b.club));
  return `<select id="${id}" onchange="suInput()">
    <option value="">— squadra —</option>
    ${opz.map(o=>`<option value="${o.k}" ${o.k===val?'selected':''}>${esc(o.club)} · ${esc(o.all)}</option>`).join('')}
  </select>`;
}
const inp=(id,val,ph,extra)=>`<input id="${id}" value="${esc(val)}" placeholder="${ph||''}" oninput="suInput()" ${extra||''}>`;
const numInp=(id,val,ph)=>inp(id,val,ph,'inputmode="decimal" class="corto"');
function righeSfida(pre,s){
  return `<div class="duello">
    <div class="duello__sq duello__c">${selSquadra(pre+'-casa',s.casa)}</div>
    <div class="duello__n duello__g">${numInp(pre+'-g1',s.g1,'gol')}<span>–</span>${numInp(pre+'-g2',s.g2,'gol')}</div>
    <div class="duello__sq duello__o">${selSquadra(pre+'-ospite',s.ospite)}</div>
  </div>
  <div class="duello duello--pt">
    <span class="duello__lbl">fantapunti</span>
    <div class="duello__n">${numInp(pre+'-p1',s.p1,'pt')}<span>·</span>${numInp(pre+'-p2',s.p2,'pt')}</div>
    <span></span>
  </div>`;
}

function scrivi(){
  if(!RED)return giornate();
  if(F.n==='')F.n=String(prossimaGiornata());
  const n=F.n,ex=esistente(n);
  const pubb=(GIORNATE||[]).slice().sort((a,b)=>b.n-a.n);
  return `<div class="page">
    <span class="eyebrow">Redazione · ${esc(RED.nome)}</span><h1 class="title">Scrivi un commento</h1>
    <p class="lede">Quello che pubblichi compare subito nel tab Commento giornate, per tutti. La bozza si salva da sola su questo dispositivo.</p>

    <div class="card" style="margin-top:22px">
      <div class="fldrow">
        <label class="fld"><span>Giornata</span><input id="f-n" type="number" min="1" max="38" value="${esc(n)}" oninput="suInput()"></label>
        <label class="fld"><span>Data (facoltativa)</span>${inp('f-data',F.data,'es. 21 settembre','maxlength="60"')}</label>
      </div>
      <label class="fld" style="margin-bottom:0"><span>Titolo (facoltativo)</span>${inp('f-titolo',F.titolo,'Il titolo della giornata','maxlength="200"')}</label>
    </div>

    <div class="card sez">
      <h2 class="sub">Partita del giorno</h2>
      ${righeSfida('p',F.p)}
      <label class="fld" style="margin-top:14px"><span>Commento</span><textarea id="f-testo" placeholder="Com'è andata?" oninput="suInput()">${esc(F.testo)}</textarea></label>
      <p class="hint">Riga vuota = nuovo paragrafo · <code>**parola**</code> = <b>grassetto</b></p>
      <div class="fldrow fldrow--2">
        <label class="fld"><span>MVP</span>${inp('p-mvp',F.p.mvp,'facoltativo','maxlength="80"')}</label>
        <label class="fld"><span>Flop</span>${inp('p-flop',F.p.flop,'facoltativo','maxlength="80"')}</label>
      </div>
    </div>

    <div class="card sez">
      <h2 class="sub">Le altre sfide</h2>
      ${F.a.map((s,i)=>`<div class="sfEd" data-sfida>
        <div class="sfEd__hd"><span class="eyebrow" style="color:var(--grigio)">Sfida ${i+2}</span>
          <button class="btn btn--sm btn--ghost" onclick="togliSfida(${i})" title="Rimuovi questa sfida">Rimuovi</button></div>
        ${righeSfida('a'+i,s)}
        <label class="fld" style="margin:12px 0 0"><span>Nota</span><textarea id="a${i}-nota" class="breve" placeholder="Due righe su com'è andata" oninput="suInput()">${esc(s.nota)}</textarea></label>
      </div>`).join('')}
      <button class="btn btn--sm btn--ghost" onclick="aggiungiSfida()" style="margin-top:4px">+ Aggiungi una sfida</button>
      <p class="hint" style="margin:10px 0 0">Le sfide lasciate senza squadre non vengono pubblicate.</p>
    </div>

    <div class="avviso" id="f-avviso" style="margin-top:18px;${ex?'':'display:none'}">Questa giornata è già pubblicata: salvando sostituisci il commento esistente.</div>
    <div class="azioni" style="margin-top:16px">
      <button class="btn btn--oro" id="f-pubblica" onclick="pubblica()" ${INVIO?'disabled':''}>${INVIO?'Invio…':ex?`Aggiorna giornata ${esc(n)}`:'Pubblica'}</button>
      <button class="btn btn--ghost" onclick="svuota()" ${INVIO?'disabled':''}>Svuota</button>
    </div>

    <h2 class="sub" style="margin:32px 0 0">Anteprima</h2>
    <div id="f-anteprima"></div>

    <div class="card" style="margin-top:28px">
      <div class="card__hd"><h2 class="sub" style="margin:0">Già pubblicati</h2><span class="num mut">${pubb.length}</span></div>
      ${pubb.length?pubb.map(g=>`<div class="pubbl"><span class="pubbl__n">${g.n}</span>
        <span class="pubbl__t">${esc(g.titolo||((g.contenuto&&g.contenuto.partita)?sq(g.contenuto.partita.casa).club+' – '+sq(g.contenuto.partita.ospite).club:'Giornata '+g.n))}</span>
        <button class="btn btn--sm btn--ghost" onclick="modifica(${g.n})">Modifica</button>
        <button class="btn btn--sm btn--rosso" onclick="CONF=${g.n};render()">Elimina</button></div>`).join('')
        :'<div class="note">Ancora nessun commento pubblicato.</div>'}
    </div>
    <p class="note" style="margin-top:22px">Stai usando un link di redazione su questo dispositivo. <a href="#" onclick="event.preventDefault();esci()" style="color:var(--grigio)">Esci</a></p>
    ${CONF!==null?`<div class="modal" onclick="if(event.target===this){CONF=null;render();}"><div class="modal__card">
      <p style="margin:0 0 16px">Eliminare il commento della giornata ${CONF}? Sparisce subito per tutti.</p>
      <div class="azioni" style="justify-content:flex-end">
        <button class="btn btn--sm btn--ghost" onclick="CONF=null;render()">Annulla</button>
        <button class="btn btn--sm btn--oro" onclick="elimina()">Elimina</button></div></div></div>`:''}
  </div>`;
}

}

/* ---------------- navigazione ----------------
   Per aggiungere un tab: una riga qui sotto e una funzione che restituisce l'HTML.
   "Scrivi" compare solo a chi ha un link di redazione valido. */
const TABS=[
  {id:'home',nome:'Home',vista:home},
  {id:'giornate',nome:'Commento giornate',corto:'Giornate',vista:giornate},
  {id:'statistiche',nome:'Statistiche',vista:statistiche},
  {id:'scrivi',nome:'✎ Scrivi',vista:scrivi,solo:()=>!!RED,cls:'nav__tab--red'}
];
function tabCorrente(){
  const h=location.hash.slice(1).split('/')[0];
  return TABS.find(t=>t.id===h&&(!t.solo||t.solo()))||TABS[0];
}
function toast(m){MSG=m;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{MSG='';render();},2600);}
function render(){
  const cur=tabCorrente();
  document.getElementById('tabs').innerHTML=TABS.filter(t=>!t.solo||t.solo()).map(t=>
    `<a class="nav__tab ${t.cls||''}" href="#${t.id}" ${t.id===cur.id?'aria-current="page"':''} style="text-decoration:none"><span class="nl">${t.nome}</span><span class="nc">${t.corto||t.nome}</span></a>`).join('');
  const attivo=document.activeElement&&document.activeElement.id;
  document.getElementById('app').innerHTML=cur.vista()+(MSG?`<div class="toast">${esc(MSG)}</div>`:'');
  if(cur.id==='scrivi'){suInput();if(attivo&&document.getElementById(attivo))document.getElementById(attivo).focus();}
}
window.addEventListener('hashchange',()=>{SEL=null;CONF=null;render();window.scrollTo(0,0);
  const n=location.hash.split('/')[1];if(n)setTimeout(()=>vaiA(n),50);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(SEL!==null)copClose();else if(CONF!==null){CONF=null;render();}}});
render();
caricaGiornate().then(()=>{const n=location.hash.split('/')[1];if(n)setTimeout(()=>vaiA(n),50);});
verificaRedattore();
</script>
